name: Spot ideas (daily)

# The Spot ideas desk once a day: picture + Arabic text to Telegram (scripts/spot_ideas_daily.py). Read-only, no orders.
on:
  schedule:
    - cron: "41 4 * * *"        # 04:41 UTC = 06:41 Cairo, before the London open
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: spot-ideas
  cancel-in-progress: false

jobs:
  ideas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas numpy requests playwright && python -m playwright install --with-deps chromium
      - name: Build the ideas and send them
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/spot_ideas_daily.py
      - name: Measure yesterday's Spot ideas (crypto only, daily candles; measurement, not a decision)
        if: always()
        continue-on-error: true
        run: python -m modules.spot_outcomes
      - name: Commit the Spot snapshot for the Workspace widget
        if: always()
        run: |
          git config user.name "xpix-spot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/spot || true
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Spot desk snapshot and ideas log $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; git rebase --abort 2>/dev/null || true; sleep 5; done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        if: always()
        with:
          name: spot-ideas
          path: |
            spot_ideas.png
            brain_*.png
          if-no-files-found: ignore
          retention-days: 14
