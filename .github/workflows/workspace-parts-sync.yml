name: Workspace parts sync

on:
  pull_request:
    branches: [main]
    paths:
      - "modules/ws/**"
      - "modules/workspace_app.html"
      - "scripts/build_workspace.py"
      - ".github/workflows/workspace-parts-sync.yml"

permissions:
  contents: read

jobs:
  parts-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: workspace_app.html must equal the build of modules/ws/
        run: python scripts/build_workspace.py --check
