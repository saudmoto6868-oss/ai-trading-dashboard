name: Strategy lab

on:
  schedule:
    - cron: "17 3 * * 0"        # weekly, Sunday 03:17 UTC
  workflow_dispatch: {}          # "Run workflow" button

permissions:
  contents: write                # commits STRATEGY_LAB.md + data/strategy_lab.json

concurrency:
  group: strategy-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas numpy requests
      - name: Walk-forward every detector on real candles
        run: python -m modules.strategy_lab
      - name: Item 1 - Group-A filters ON vs OFF
        continue-on-error: true
        timeout-minutes: 80
        run: python -m modules.backtest_filters
      - name: Commit the results
        run: |
          git config user.name "strategy-lab bot"
          git config user.email "actions@users.noreply.github.com"
          git add STRATEGY_LAB.md data/strategy_lab.json FILTER_COMPARE.md data/filter_compare.json 2>/dev/null || git add STRATEGY_LAB.md data/strategy_lab.json
          git diff --cached --quiet && exit 0
          git commit -m "Strategy lab results $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
