name: A+ setups backtest (weekly + manual)

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 0"        # Sundays 06:23 UTC

permissions:
  contents: write

concurrency:
  group: aplus-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pandas numpy requests
      - name: Walk-forward on OKX candles (BTC / ETH / SOL, 1H + 4H)
        run: python -m modules.aplus_backtest
      - name: Commit the report
        run: |
          git config user.name "xpix-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/research/aplus_backtest.json || true
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "A+ setups backtest $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; git rebase --abort 2>/dev/null || true; sleep 5; done
