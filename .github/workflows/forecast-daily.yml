name: Daily baseline calls (record + score)

on:
  schedule:
    - cron: "10 22 * * *"          # daily, after the US close (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: forecast-daily
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas numpy requests
      - name: Record today's baseline calls, then score the due ones
        run: |
          python -m modules.daily_forecast --record --score
      - name: Commit the results (scheduled run -> main, like the lab and snapshot bots; manual run -> its own branch)
        run: |
          git config user.name "forecast bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/forecasts docs/forecasts
          git diff --cached --quiet && exit 0
          git commit -q -m "Daily baseline calls $(date -u +%F)"
          TARGET="${GITHUB_REF_NAME:-main}"; if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then TARGET=main; fi
          # only this bot writes data/forecasts and docs/forecasts, so a rebase onto a moved branch cannot conflict with people's work
          ok=0; for i in 1 2 3; do git pull -q --rebase -X theirs origin "$TARGET" && git push -q origin HEAD:"$TARGET" && { ok=1; break; }; git rebase --abort 2>/dev/null || true; sleep 5; done
          [ "$ok" = 1 ] || { echo "results NOT pushed"; exit 1; }
