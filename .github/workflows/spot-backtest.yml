name: Spot backtest

# Backtest of the Spot analyzer score (scripts/spot_backtest.py). Runs on its own every Monday; the short Arabic result
# goes to Telegram, the full tables to this run's Summary + artifact. Read-only: no orders, nothing written to the repo.
on:
  schedule:
    - cron: "17 3 * * 1"        # Monday 03:17 UTC (after the weekly candle closed)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: spot-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas numpy requests
      - name: Walk-forward test of the score (crypto + metals, weekly + monthly)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/spot_backtest.py --telegram
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: spot-backtest
          path: |
            spot_backtest.json
            spot_backtest.md
          if-no-files-found: ignore
          retention-days: 90
