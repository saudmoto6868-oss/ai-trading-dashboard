name: Spot ideas (daily)

# The Spot ideas desk once a day: picture + Arabic text to Telegram (scripts/spot_ideas_daily.py). Read-only, no orders.
on:
  schedule:
    - cron: "41 4 * * *"        # 04:41 UTC = 06:41 Cairo, before the London open
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: spot-ideas
  cancel-in-progress: false

jobs:
  ideas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas numpy requests playwright && python -m playwright install --with-deps chromium
      - name: Build the ideas and send them
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/spot_ideas_daily.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: spot-ideas
          path: spot_ideas.png
          if-no-files-found: ignore
          retention-days: 14
