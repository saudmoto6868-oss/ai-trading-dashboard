<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#050505;--panel:#0d0d0d;--line:#2a2a2a;--gold:#d4af37;--teal:#26a69a;--red:#ef5350;--text:#e8e8e8;--dim:#8a8a8a}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:12px "Segoe UI",Arial,sans-serif}
#bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--gold);background:#0b0b0b}
#bar select,#bar button{background:#161616;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:3px 7px;font-size:12px}
#bar b{color:var(--gold)}#live{font-weight:700}#px{font:700 15px ui-monospace,Menlo,monospace}
body{display:flex;flex-direction:column}#grid{display:grid;grid-template-columns:1fr 230px;flex:1;min-height:0}#grid.noside{grid-template-columns:1fr}#grid.noside #side{display:none}
#charts{min-width:0;display:flex;flex-direction:column;min-height:0}#cw{position:relative;flex:1;min-height:200px}#chart{position:absolute;inset:0}#ov{position:absolute;inset:0;pointer-events:none;z-index:3}#osc{height:130px;border-top:1px solid var(--line)}#macd{height:80px;border-top:1px solid var(--line)}
.tg{display:inline-flex;align-items:center;gap:3px;color:var(--dim);cursor:pointer;user-select:none;padding:1px 5px;border:1px solid var(--line);border-radius:10px}.tg input{margin:0;accent-color:#d4af37}.tg:has(input:checked){color:var(--text);border-color:var(--gold)}
#side{border-left:1px solid var(--gold);background:var(--panel);padding:8px 10px;overflow:auto;min-height:0}
#side h3{margin:8px 0 4px;color:var(--gold);font-size:11px;letter-spacing:.06em;text-transform:uppercase}#side h3:first-child{margin-top:0}
.r{display:flex;justify-content:space-between;padding:2px 0;color:var(--dim)}.r b{color:var(--text);font-weight:600}
.up{color:var(--teal)!important}.dn{color:var(--red)!important}
#note{padding:3px 10px;color:var(--dim);font-size:10px;border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:760px){#grid{grid-template-columns:1fr}#side{border-left:0;border-top:1px solid var(--gold);max-height:none}}
</style></head><body>
<div id="bar"><b>V7 LIVE</b><span style="color:var(--dim)">research only</span>
 <select id="sym"></select><select id="tf"></select>
 <button id="ctr" title="Put the current candle back in the middle">Center on now</button><span class="tgs"></span><span id="px">-</span><span id="chg"></span><span id="live" class="dn">connecting...</span></div>
<div id="grid"><div id="charts"><div id="cw"><div id="chart"></div><canvas id="ov"></canvas></div><div id="osc"></div><div id="macd"></div></div>
<div id="side"><h3>Day plan (rule-based Director)</h3><div id="plan">loading...</div><h3>Live readout</h3><div id="read"></div><h3>Structure &amp; liquidity (closed candles)</h3><div id="struct">loading...</div><h3>Research signals (rule B)</h3><div id="sigs"></div></div></div>
<div id="note" title="Live candles from OKX (crypto) / Hyperliquid xyz perps (gold, silver), 5 s refresh, CFX v7 settings, computed in your browser. Research dots = rule B on closed candles (62 signals, 59.7% against, p~0.13): NOT an edge, NOT a recommendation, no orders.">Live OKX / Hyperliquid, 5 s · CFX v7 settings · research only, not an edge, no orders (hover for details)</div>
<script>/*LIB*/</script>
<script>/*IND*/</script>
<script>/*STRUCT*/</script>
<script>
(function(){
const SYMS=[['BTC-USDT','okx','BTC-USDT'],['ETH-USDT','okx','ETH-USDT'],['SOL-USDT','okx','SOL-USDT'],['XRP-USDT','okx','XRP-USDT'],['DOGE-USDT','okx','DOGE-USDT'],['GOLD (Hyperliquid xyz perp)','hl','xyz:GOLD'],['SILVER (Hyperliquid xyz perp)','hl','xyz:SILVER']];
const TFS={'5m':{okx:'5m',hl:'5m',sec:300},'15m':{okx:'15m',hl:'15m',sec:900},'1H':{okx:'1H',hl:'1h',sec:3600},'4H':{okx:'4H',hl:'4h',sec:14400},'1D':{okx:'1D',hl:'1d',sec:86400}};
const $=id=>document.getElementById(id),I=window.V7IND,fin=Number.isFinite;
SYMS.forEach((s,i)=>$('sym').append(Object.assign(document.createElement('option'),{value:i,textContent:s[0]})));
Object.keys(TFS).forEach(t=>$('tf').append(Object.assign(document.createElement('option'),{value:t,textContent:t})));
$('tf').value='15m';
function cairo(time,type){const ts=typeof time==='number'?time:Date.UTC(time.year,time.month-1,time.day)/1000;const pr=new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Cairo',year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date(ts*1000));const g=k=>(pr.find(x=>x.type===k)||{}).value||'';return type===0?g('year'):type===1?g('month'):type===2?g('day'):g('hour')+':'+g('minute');}
const base={layout:{background:{color:'#050505'},textColor:'#8a8a8a'},grid:{vertLines:{color:'#141414'},horzLines:{color:'#141414'}},rightPriceScale:{borderColor:'#333'},crosshair:{mode:0},localization:{locale:'en-GB',timeFormatter:t=>cairo(t,3)}};
const mk=(el,extra)=>LightweightCharts.createChart($(el),Object.assign({width:$(el).clientWidth,height:$(el).clientHeight},base,extra||{}));
const ch=mk('chart',{timeScale:{borderColor:'#333',timeVisible:true,secondsVisible:false,tickMarkFormatter:cairo}});
const oc=mk('osc',{timeScale:{borderColor:'#333',visible:false},rightPriceScale:{borderColor:'#333',scaleMargins:{top:.06,bottom:.08}}});
const mc=mk('macd',{timeScale:{borderColor:'#333',visible:false}});
const cs=ch.addCandlestickSeries({upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,wickUpColor:'#26a69a',wickDownColor:'#ef5350'});
const s77=ch.addLineSeries({color:'#ff9800',lineWidth:1,lineStyle:2,lastValueVisible:false,priceLineVisible:false});
const s144=ch.addLineSeries({color:'#ef5350',lineWidth:1,lineStyle:2,lastValueVisible:false,priceLineVisible:false});
const sk=oc.addLineSeries({color:'#42a5f5',lineWidth:2,autoscaleInfoProvider:()=>({priceRange:{minValue:0,maxValue:100}})});
const sd=oc.addLineSeries({color:'#ef9a9a',lineWidth:1,lastValueVisible:false});
const sr=oc.addLineSeries({color:'#b39ddb',lineWidth:1,lastValueVisible:false});
[15,50,85].forEach(v=>sk.createPriceLine({price:v,color:v===50?'#555':v<50?'#26a69a':'#ef5350',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:String(v)}));
const sm=mc.addLineSeries({color:'#9e9e9e',lineWidth:1,lastValueVisible:true});
sm.createPriceLine({price:0,color:'#555',lineWidth:1,lineStyle:2,axisLabelVisible:false});
let syncing=false;const link=(a,bs)=>a.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(syncing||!r)return;syncing=true;bs.forEach(b=>b.timeScale().setVisibleLogicalRange(r));syncing=false;});
link(ch,[oc,mc]);
new ResizeObserver(()=>{[[ch,'chart'],[oc,'osc'],[mc,'macd']].forEach(([c,e])=>c.applyOptions({width:$(e).clientWidth,height:$(e).clientHeight}));drawOv();}).observe($('charts'));
const S=window.V7STRUCT,TOG=[['sig','Signals',1],['sma','SMA 77/144',1],['ses','Sessions',1],['pd','PDH/PDL',1],['bos','BOS/CHoCH',1],['fvg','FVG',1],['eq','EQH/EQL',1],['mid','50%',1],['ote','OTE',0],['side','Panel',1]];
const on={};try{Object.assign(on,JSON.parse(localStorage.getItem('v7tog')||'{}'));}catch(e){}
const tgs=document.querySelector('.tgs');TOG.forEach(([k,l,d])=>{if(!(k in on))on[k]=!!d;const lb=document.createElement('label');lb.className='tg';const c=document.createElement('input');c.type='checkbox';c.checked=on[k];c.onchange=()=>{on[k]=c.checked;try{localStorage.setItem('v7tog',JSON.stringify(on));}catch(e){}applyTog();};lb.append(c,l);tgs.append(lb);});
let LB=[],LI=null,LS=null,PL=[];
const ov=$('ov'),ox=ov.getContext('2d');
function drawOv(){const w=$('cw').clientWidth,h=$('cw').clientHeight,dpr=window.devicePixelRatio||1;if(ov.width!==w*dpr||ov.height!==h*dpr){ov.width=w*dpr;ov.height=h*dpr;ov.style.width=w+'px';ov.style.height=h+'px';}ox.setTransform(dpr,0,0,dpr,0,0);ox.clearRect(0,0,w,h);if(!LS||!LB.length)return;
  const X=i=>ch.timeScale().logicalToCoordinate(i),Y=p=>cs.priceToCoordinate(p),R=w-60;
  const box=(i0,i1,hi,lo,fill,line,txt)=>{const a=X(i0),b=X(i1),y1=Y(hi),y2=Y(lo);if(a==null||b==null||y1==null||y2==null)return;const x0=Math.max(0,Math.min(a,b)),x1=Math.min(R,Math.max(a,b)+4);if(x1<=x0)return;ox.fillStyle=fill;ox.fillRect(x0,Math.min(y1,y2),x1-x0,Math.abs(y2-y1));if(line){ox.strokeStyle=line;ox.lineWidth=1;ox.strokeRect(x0+.5,Math.min(y1,y2)+.5,x1-x0,Math.abs(y2-y1));}if(txt){ox.fillStyle=line||'#999';ox.font='10px sans-serif';ox.fillText(txt,x0+3,Math.min(y1,y2)+11);}};
  if(on.ses)LS.sessions.forEach(r=>box(r.i0,r.i1,r.hi,r.lo,r.name==='Asia'?'rgba(120,120,255,.07)':r.name==='London'?'rgba(255,180,60,.07)':'rgba(60,200,120,.07)',r.name==='Asia'?'rgba(120,120,255,.45)':r.name==='London'?'rgba(255,180,60,.45)':'rgba(60,200,120,.45)',r.name));
  if(on.fvg)LS.fvg.forEach(z=>box(z.i0,LB.length-1+30,z.hi,z.lo,z.dir==='bull'?'rgba(38,166,154,.18)':'rgba(239,83,80,.18)',null,''));
  if(on.eq)[...LS.eqh,...LS.eql].forEach(q=>{const a=X(q.i1),b=X(q.i2),y=Y(q.p);if(a==null||b==null||y==null)return;ox.strokeStyle='#ffd54f';ox.setLineDash([3,3]);ox.beginPath();ox.moveTo(a,y);ox.lineTo(Math.min(R,b+30),y);ox.stroke();ox.setLineDash([]);ox.fillStyle='#ffd54f';ox.font='10px sans-serif';ox.fillText(q.type,Math.min(R,b+32),y+3);});
  if(on.bos)LS.events.forEach(e=>{const a=X(e.from),b=X(e.i),y=Y(e.level);if(a==null||b==null||y==null)return;const c=e.type==='CHoCH'?'#ff7043':'#90caf9';ox.strokeStyle=c;ox.setLineDash([5,3]);ox.beginPath();ox.moveTo(a,y);ox.lineTo(b,y);ox.stroke();ox.setLineDash([]);ox.fillStyle=c;ox.font='bold 10px sans-serif';ox.fillText(e.type+(e.dir==='up'?' ▲':' ▼'),(a+b)/2-14,y-3);});}
function levels(){PL.forEach(l=>cs.removePriceLine(l));PL=[];if(!LS)return;const add=(p,c,t,st)=>{if(fin(p))PL.push(cs.createPriceLine({price:p,color:c,lineWidth:1,lineStyle:st,axisLabelVisible:true,title:t}));};
  if(on.pd&&LS.prevDay){add(LS.prevDay.hi,'#4dd0e1','PDH',2);add(LS.prevDay.lo,'#4dd0e1','PDL',2);}
  if(on.mid&&LS.pd){add(LS.pd.eq,'#9e9e9e','50%',1);}
  if(on.ote&&LS.ote){add(LS.ote.p62,'#ce93d8','OTE .62',2);add(LS.ote.p79,'#ce93d8','OTE .79',2);}}
function applyTog(){$('grid').classList.toggle('noside',!on.side);s77.applyOptions({visible:on.sma});s144.applyOptions({visible:on.sma});levels();drawOv();if(LB.length)setMarks();setTimeout(()=>{[[ch,'chart'],[oc,'osc'],[mc,'macd']].forEach(([c,e])=>c.applyOptions({width:$(e).clientWidth,height:$(e).clientHeight}));drawOv();},30);}
let LSIG=[];function setMarks(){const m=[];if(on.sig)LSIG.forEach(x=>m.push({time:LB[x.i].time,position:x.side==='buy'?'belowBar':'aboveBar',color:x.side==='buy'?'#26a69a':'#ef5350',shape:x.side==='buy'?'arrowUp':'arrowDown',text:'research '+x.side}));
  if(on.bos&&LS)LS.events.forEach(e=>m.push({time:LB[e.i].time,position:e.dir==='up'?'belowBar':'aboveBar',color:e.type==='CHoCH'?'#ff7043':'#90caf9',shape:'circle',text:e.type}));m.sort((a,b)=>a.time-b.time);cs.setMarkers(m);}
ch.timeScale().subscribeVisibleLogicalRangeChange(()=>drawOv());
let first=true,lastOk=0,busy=false,lastKey='';
async function getOKX(inst,bar){const r=await fetch('https://www.okx.com/api/v5/market/candles?instId='+inst+'&bar='+bar+'&limit=300');const j=await r.json();if(!(j&&j.code==='0'&&Array.isArray(j.data)))throw new Error('OKX bad reply');return j.data.map(k=>({time:Math.floor(+k[0]/1000),open:+k[1],high:+k[2],low:+k[3],close:+k[4],closed:k[8]==='1'})).reverse();}
async function getHL(coin,iv,sec){const now=Date.now();const r=await fetch('https://api.hyperliquid.xyz/info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'candleSnapshot',req:{coin:coin,interval:iv,startTime:now-300*sec*1000,endTime:now}})});const j=await r.json();if(!Array.isArray(j)||!j.length)throw new Error('Hyperliquid returned no candles');return j.map(k=>({time:Math.floor(k.t/1000),open:+k.o,high:+k.h,low:+k.l,close:+k.c,closed:k.T<now})).sort((a,b)=>a.time-b.time);}
let nBars=0;
function center(){const n=nBars-1,half=Math.max(40,Math.min(110,Math.round(n/3)));ch.timeScale().setVisibleLogicalRange({from:n-half,to:n+half});}   // the current candle sits in the MIDDLE of the screen, empty space on its right
const pts=(bars,arr)=>bars.map((b,i)=>fin(arr[i])?{time:b.time,value:arr[i]}:null).filter(Boolean);
const row=(k,v,c)=>'<div class="r"><span>'+k+'</span><b'+(c?' class="'+c+'"':'')+'>'+v+'</b></div>';
const f2=v=>fin(v)?v.toFixed(2):'-';
function fmtT(t){return new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Cairo',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(t*1000));}
async function tick(){if(busy)return;busy=true;const s=SYMS[+$('sym').value],tf=TFS[$('tf').value];
  try{const bars=s[1]==='okx'?await getOKX(s[2],tf.okx):await getHL(s[2],tf.hl,tf.sec);
    const ind=I.compute(bars),lastClosed=bars.length-1-(bars[bars.length-1].closed?0:1),sig=I.signalsB(ind,lastClosed);
    nBars=bars.length;const key=bars.length+'|'+bars[bars.length-1].time,full=first||key!==lastKey;lastKey=key;
    const vr=full&&!first?ch.timeScale().getVisibleLogicalRange():null;
    const feed=(series,data)=>{if(full)series.setData(data);else if(data.length)series.update(data[data.length-1]);};   // update() only accepts the last bar or a newer one: a new candle reloads everything
    feed(cs,bars.map(b=>({time:b.time,open:b.open,high:b.high,low:b.low,close:b.close})));feed(s77,pts(bars,ind.sma77));feed(s144,pts(bars,ind.sma144));
    feed(sk,pts(bars,ind.k));feed(sd,pts(bars,ind.d));feed(sr,pts(bars,ind.rsi));feed(sm,pts(bars,ind.macd));
    const closed=bars.length&&bars[bars.length-1].closed===false?bars.slice(0,-1):bars;   // structure from CLOSED candles only (indices stay valid: closed is a prefix of bars)
    LB=bars;LI=ind;LSIG=sig;LS=S.compute(closed);levels();setMarks();
    if(first){center();first=false;}else if(vr){ch.timeScale().setVisibleLogicalRange(vr);}drawOv();
    const L=bars[bars.length-1],n=bars.length-1,chg=(L.close/bars[0].close-1)*100;
    $('px').textContent=L.close.toPrecision(L.close>=100?7:5);$('chg').textContent=(chg>=0?'+':'')+chg.toFixed(2)+'% over '+bars.length+' bars';$('chg').className=chg>=0?'up':'dn';
    lastOk=Date.now();$('live').textContent='LIVE';$('live').className='up';
    const k=ind.k[n],d=ind.d[n],r=ind.rsi[n],m=ind.macd[n],m1=ind.macd[n-1],a77=ind.sma77[n],a144=ind.sma144[n];
    $('read').innerHTML=row('Source',s[1]==='okx'?'OKX spot candles':'Hyperliquid xyz perp')+row('Last bar opened',fmtT(L.time)+' Cairo'+(L.closed?'':' (forming)'))+
      row('Stoch %K / %D',f2(k)+' / '+f2(d),k<=15?'up':k>=85?'dn':'')+row('RSI 14',f2(r),r<=10?'up':r>=90?'dn':'')+
      row('MACD (12,26)',f2(m)+(fin(m1)?(m>m1?' rising':' falling'):''),fin(m1)?(m>m1?'up':'dn'):'')+
      row('SMA 77',f2(a77),fin(a77)?(L.close>a77?'up':'dn'):'')+row('SMA 144',f2(a144),fin(a144)?(L.close>a144?'up':'dn'):'')+
      row('Bars loaded',bars.length)+(bars.length<150?row('Note','fewer than 144 bars: SMA 144 not complete yet','dn'):'');
    const ls=sig[sig.length-1];$('sigs').innerHTML=row('Signals in window',sig.length+' (closed candles)')+(ls?row('Last',ls.side+' @ '+fmtT(bars[ls.i].time)+', '+(lastClosed-ls.i)+' bars ago',ls.side==='buy'?'up':'dn'):row('Last','none in this window'))+
      '<div class="r" style="display:block;font-size:10px;margin-top:4px">Research rule, not evidence: under 30 cases per setup it proves nothing, and the original sample was 59.7% against the move.</div>';
    {const z=LS,H=z.sw.H,Lo=z.sw.L,sh=H[H.length-1],sl=Lo[Lo.length-1],eh=z.eqh[z.eqh.length-1],el=z.eql[z.eql.length-1],fz=z.fvg[z.fvg.length-1],pd=z.prevDay,ote=z.ote,ev=z.events[z.events.length-1];
      const ses=z.sessions.slice(-3).map(x=>x.name+' '+fmtT(closed[x.i0].time)+'-'+fmtT(closed[x.i1].time)).join(' | ');
      $('struct').innerHTML=row('Bars used',closed.length+' closed')+row('Last confirmed swing H / L',(sh?f2(sh.p):'-')+' / '+(sl?f2(sl.p):'-'))+
        row('Structure trend',z.trend||'unconfirmed',z.trend==='up'?'up':z.trend==='down'?'dn':'')+row('Latest BOS / CHoCH',ev?ev.type+' '+ev.dir:'none')+
        row('EQH / EQL',(eh?f2(eh.p):'-')+' / '+(el?f2(el.p):'-'))+row('Unfilled FVGs',String(z.fvg.length)+(fz?' (latest '+fz.dir+' '+f2(fz.lo)+'-'+f2(fz.hi)+')':''))+
        row('Premium / discount EQ',z.pd?f2(z.pd.eq):'-')+row('OTE 62 / 70.5 / 79',ote?ote.dir+' '+f2(ote.p62)+' / '+f2(ote.p705)+' / '+f2(ote.p79):'-')+
        row('Previous NY session H / L',pd?f2(pd.hi)+' / '+f2(pd.lo):'not enough history')+row('Recent sessions',ses||'none in loaded bars')+
        '<div class="r" style="display:block;font-size:10px;margin-top:4px">Structure values come from closed candles only. Research context; not entries or trade signals.</div>';}
  }catch(e){$('live').textContent='ERROR: '+String(e&&e.message||e).slice(0,70);$('live').className='dn';}
  busy=false;}
async function getFor(s,name){const tf=TFS[name];return s[1]==='okx'?getOKX(s[2],tf.okx):getHL(s[2],tf.hl,tf.sec);}
let planBusy=false;
async function planTick(){if(planBusy)return;planBusy=true;const s=SYMS[+$('sym').value];
  try{const r=await Promise.all(['1D','4H','1H','15m'].map(n=>getFor(s,n)));const p=I.dayPlan({d1:r[0],h4:r[1],h1:r[2],m15:r[3]},Date.now());
    const col=p.state.indexOf('LONG')>=0?'up':p.state.indexOf('SHORT')>=0?'dn':'';
    const L=(a,c,t)=>a.length?'<div style="font-size:10px;margin-top:3px"><span class="'+c+'" style="font-weight:700">'+t+'</span>'+a.map(x=>'<div>- '+x+'</div>').join('')+'</div>':'';
    $('plan').innerHTML=row('Verdict',p.state,col)+row('Bias',p.dir||'none')+row('1D / 4H / 1H / 15m',[p.trends.d1,p.trends.h4,p.trends.h1,p.trends.m15].map(x=>x||'-').join(' / '))+
      row('Session (NY clock)',((p.session.asia?'Asia ':'')+(p.session.london?'London ':'')+(p.session.ny?'NY':''))||'closed')+row('Kill zone',p.session.kz||'none')+
      (p.levels?row('Prev daily high / low',f2(p.levels.pdh)+' / '+f2(p.levels.pdl))+row('Price in prev. range',p.levels.pos==null?'-':Math.round(p.levels.pos*100)+'%'):'')+
      L(p.agree,'up','Agrees')+L(p.conflict,'dn','Conflicts')+L(p.waiting,'','Waiting for')+
      '<div class="r" style="display:block;font-size:10px;margin-top:4px">Rule-based context, not a trade call: no entry, stop or target. If a plan is ever taken: risk '+p.risk.basePct+'% of equity, R:R at least 1:'+p.risk.minRR+' (platform policy).</div>';
  }catch(e){$('plan').textContent='Day plan unavailable: '+String(e&&e.message||e).slice(0,60);}
  planBusy=false;}
$('ctr').onclick=()=>center();
$('sym').onchange=$('tf').onchange=()=>{LS=null;levels();first=true;lastKey='';cs.setData([]);[s77,s144,sk,sd,sr,sm].forEach(x=>x.setData([]));tick();planTick();};
setInterval(()=>{if(!document.hidden)tick();if(lastOk&&Date.now()-lastOk>20000){$('live').textContent='STALE '+Math.round((Date.now()-lastOk)/1000)+'s';$('live').className='dn';}},5000);
applyTog();tick();planTick();setInterval(()=>{if(!document.hidden)planTick();},60000);
})();
</script></body></html>
