<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#05070a;--panel:#0b0f14;--line:#1c232b;--txt:#e6e9ee;--mut:#7d8794;--acc:#f0b90b}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:transparent;color:var(--txt);font:12px/1.3 -apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#strip{height:46px;display:flex;align-items:center;gap:10px;padding:0 2px;position:relative;background:transparent;border:0}
#logo{flex:none;display:flex;align-items:center;height:40px;margin-inline-end:6px}
#logo img{height:38px;max-width:170px;object-fit:contain}#logo svg{height:32px;width:auto;display:block}
.sep{flex:none;width:1px;height:22px;background:var(--line)}
.cap{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
#logo .wm{display:flex;align-items:baseline;gap:5px;line-height:1;white-space:nowrap}
/* golden-ratio wordmark: 6868 is 1.618x the size of X PIX (26px / 16px) */
#logo .wm b{font-size:26px;font-weight:800;letter-spacing:.5px;background:linear-gradient(180deg,#ffe58a,#f0b90b 55%,#b98400);-webkit-background-clip:text;background-clip:text;color:transparent}
#logo .wm i{font-style:normal;font-size:16px;font-weight:700;letter-spacing:2px;color:#eaecef}
.lk{flex:none;display:flex;align-items:center;gap:5px;color:var(--txt);text-decoration:none;border:1px solid transparent;border-radius:5px;padding:3px 8px;background:transparent;white-space:nowrap;cursor:pointer;font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.lk:hover{border-color:var(--acc);color:var(--acc)}.lk img{width:14px;height:14px}.lk .ch{width:14px;height:14px;border-radius:3px;background:#2b3139;text-align:center;line-height:14px;font-size:9px}
#tick{flex:1;min-width:60px;height:28px;border:1px solid var(--line);border-radius:5px;background:var(--panel);overflow:hidden;white-space:nowrap;cursor:pointer;position:relative}
#tick .track{display:inline-block;white-space:nowrap;line-height:26px;color:#c3c9d1;animation:sc var(--dur,90s) linear infinite}
#tick:hover .track{animation-play-state:paused}@keyframes sc{from{transform:translateX(0)}to{transform:translateX(-50%)}}
#tick .tag{position:absolute;left:0;top:0;bottom:0;padding:0 9px;background:var(--panel);z-index:2;line-height:26px;color:var(--acc);font-weight:700;font-size:10px;letter-spacing:.16em;border-right:1px solid var(--line)}
#tick .track{padding-left:70px}
.clk{flex:none;display:flex;align-items:baseline;gap:5px;padding:0 2px}
.clk small{font-size:9px;color:var(--mut);letter-spacing:.16em}.clk b{font:600 13px ui-monospace,Menlo,Consolas,monospace;color:var(--txt)}
#wm{flex:none;cursor:pointer}
#rt{flex:none;display:flex;align-items:center;justify-content:flex-end;gap:10px}
.pop{position:absolute;top:50px;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.6);display:none}
.pop.on{display:block}
#newsPop{left:70px;right:260px;max-height:360px;overflow:auto;padding:4px}
#newsPop a{display:block;color:var(--txt);text-decoration:none;padding:5px 8px;border-bottom:1px solid #20262c}#newsPop a:hover{background:#1e2329;color:var(--acc)}
#newsPop .m{color:var(--mut);font-size:10px}
#fvPop{padding:6px;min-width:230px;max-height:420px;overflow:auto}#fvPop a{display:flex;align-items:center;gap:7px;color:var(--txt);text-decoration:none;padding:4px 8px;border-radius:4px}#fvPop a:hover{color:var(--acc);background:#11161c}
#fvPop a img{width:14px;height:14px}#fvPop .h{font-size:9px;letter-spacing:.16em;color:var(--mut);padding:6px 8px 2px;text-transform:uppercase}#fvPop .sub a{padding-inline-start:28px;font-size:11px;color:#c3c9d1}
#wmPop{right:4px;width:min(880px,calc(100% - 8px));padding:6px}
#wmPop .row{display:flex;gap:8px}#mapc{flex:1;min-width:0;background:#0d1217;border:1px solid var(--line);border-radius:6px;position:relative}
#mapc canvas{width:100%;display:block;cursor:pointer}
#side{width:260px;flex:none;max-height:330px;overflow:auto;font-size:11px}
#side .ev{padding:4px 6px;border-bottom:1px solid #20262c;cursor:pointer}#side .ev:hover,#side .ev.sel{background:#1e2329}
#side .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:5px}
#det{margin-top:4px;padding:6px;border:1px solid var(--line);border-radius:6px;background:#10151a;font-size:11px;min-height:38px}
#det a{color:#4aa3ff}
.leg{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0;font-size:10px;color:var(--mut)}.leg label{cursor:pointer;display:flex;align-items:center;gap:3px}
#bell{flex:none;max-width:230px;min-width:0;border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:3px 8px;cursor:pointer;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bell.hot{border-color:#f6465d;color:#f6465d}#bell.blink{animation:bl .8s infinite}@keyframes bl{50%{background:#3a1218}}
#evpop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,92%);max-height:92%;overflow:auto;background:#10151a;border:1px solid var(--acc);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.8);padding:10px 12px;z-index:5;display:none}
#evpop h4{margin:0 0 4px;font-size:13px}#evpop .x{position:absolute;right:8px;top:6px;cursor:pointer;color:var(--mut)}
#evpop a{color:#4aa3ff}#evpop .hl{padding:4px 0;border-top:1px solid #20262c}
#st{color:var(--mut);font-size:10px;margin-inline-start:6px}
/* phones: logo, resources, news button, clocks (no seconds), world - everything else folds away; popups full width */
@media (max-width:560px){#strip{gap:6px;padding:0 4px}#logo svg{height:34px}.sep,#bell{display:none}#tick{flex:0 0 74px}#tick .track{display:none}
.clk small{display:none}.clk b{font-size:12px}#rt{gap:6px}.pop{left:4px!important;right:4px!important;width:auto!important;min-width:0}#side{width:100%}#wmPop .row{flex-direction:column}}
@media (max-width:440px){#rt .clk + .clk{display:none}}
/* logo barcode: a wave runs through the bars (like a dot-grid ripple) with a gold glint, repeating */
#logo rect{transform-box:fill-box;transform-origin:50% 100%;animation:bcWave 3.2s cubic-bezier(.45,0,.25,1) infinite}
@keyframes bcWave{0%,40%,100%{transform:scaleY(1);fill:#e3e4e8}12%{transform:scaleY(.55);fill:#f0b90b}24%{transform:scaleY(1.04);fill:#ffe9a3}}
@media (prefers-reduced-motion:reduce){#logo rect{animation:none}}
</style></head><body>
<div id="strip">

  <div class="sep"></div><div id="links" style="display:flex;gap:4px;align-items:center;flex:none"></div>

  <div class="clk"><small>NY</small><b id="tn">--:--:--</b></div>

  <div class="pop" id="fvPop"></div>
  <div class="pop" id="newsPop"></div>
  <div class="pop" id="wmPop">

</div>
<script>

if (CFG.theme === "lux"){ const r = document.documentElement.style; [["--bg","#0d0c0a"],["--panel","rgba(24,21,18,.82)"],["--line","rgba(224,169,90,.20)"],["--txt","#efe6d6"],["--mut","#a8997f"],["--acc","#e0a95a"]].forEach(([k, v]) => r.setProperty(k, v));

/* main logo (owner design): slanted panel with XPiX + a barcode (modules/xpix_barcode.svg, widths / tops seeded with 6868); the bar-star mark is the app icon */

ect x="337.1" y="32" width="5.0" height="140" fill="#e3e4e8"/><rect x="348.9" y="14" width="1.6" height="158" fill="#e3e4e8"/><rect x="353.5" y="22" width="3.2" height="150" fill="#e3e4e8"/><rect x="363.5" y="0" width="2.2" height="172" fill="#e3e4e8"/><rect x="372.5" y="60" width="2.2" height="112" fill="#e3e4e8"/><rect x="376.7" y="45" width="7.5" height="127" fill="#e3e4e8"/><rect x="388.7" y="14" width="1.6" height="158" fill="#e3e4e8"/><rect x="392.3" y="14" width="1.6" height="158" fill="#e3e4e8"/><rect x="400.7" y="32" width="5.0" height="140" fill="#e3e4e8"/><rect x="412.5" y="22" width="2.2" height="150" fill="#e3e4e8"/><rect x="417.7" y="0" width="1.6" height="172" fill="#e3e4e8"/><rect x="422.3" y="0" width="1.6" height="172" fill="#e3e4e8"/><rect x="428.4" y="32" width="2.2" height="140" fill="#e3e4e8"/><rect x="435.1" y="45" width="2.2" height="127" fill="#e3e4e8"/><rect x="439.3" y="45" width="1.6" height="127" fill="#e3e4e8"/><rect x="445.4" y="0" width="5.0" height="172" fill="#e3e4e8"/><rect x="452.4" y="0" width="3.2" height="172" fill="#e3e4e8"/><rect x="457.6" y="0" width="5.0" height="172" fill="#e3e4e8"/><rect x="465.6" y="0" width="1.6" height="172" fill="#e3e4e8"/><rect x="469.2" y="32" width="7.5" height="140" fill="#e3e4e8"/><rect x="483.5" y="45" width="5.0" height="127" fill="#e3e4e8"/><rect x="495.3" y="0" width="7.5" height="172" fill="#e3e4e8"/><rect x="505.8" y="32" width="7.5" height="140" fill="#e3e4e8"/><rect x="520.1" y="60" width="5.0" height="112" fill="#e3e4e8"/><rect x="531.9" y="32" width="3.2" height="140" fill="#e3e4e8"/><rect x="538.1" y="0" width="7.5" height="172" fill="#e3e4e8"/></svg>';
/* ---- frame resizing so popups can overlay the page below ---- */
const BASE_H = 48;
function setFrame(h){
  try {
    const f = window.frameElement; if (!f) return;
    const p = f.parentElement;
    if (h > BASE_H){ p.style.height = BASE_H+"px"; p.style.position = "relative"; p.style.overflow = "visible"; f.style.position = "absolute"; f.style.left = "0"; f.style.top = "0"; f.style.width = "100%"; f.style.zIndex = 99999; f.style.height = h+"px"; }
    else { f.style.height = BASE_H+"px"; f.style.position = ""; f.style.zIndex = ""; p.style.height = ""; }
  } catch(e){}
}
let openId = null;
function closeAll(){ ["newsPop","fvPop","wmPop","kbPop"].forEach(i => $(i).classList.remove("on")); openId = null; setFrame(BASE_H); }
function openPop(id, h){ closeAll(); $(id).classList.add("on"); openId = id; setFrame(h); }
document.addEventListener("pointerdown", e => { if (openId && !e.target.closest(".pop,#tick,#wm,.fv,#kb")) closeAll(); });

const KB = [["Alt+1 … 7", ["Pages: Workspace, Scanner, Lab, Playbook, Stats, AI, Alerts","الصفحات: الوورك سبيس، السكانر، المعمل، الدليل، الأداء، الذكي، التنبيهات"]],
  ["Alt+F", ["Fold / unfold the header","طي / فتح الشريط العلوي"]], ["Alt+T", ["Next theme","الثيم اللي بعده"]], ["Alt+L", ["Arabic / English","عربي / إنجليزي"]],
  ["Alt+R", ["Resources menu","قايمة المصادر"]], ["Alt+N", ["News list","قايمة الأخبار"]], ["Alt+W", ["World map","خريطة العالم"]], ["Esc", ["Close menus","قفل القوايم"]]];
$("kbPop").innerHTML = '<div style="padding:8px 12px;min-width:250px">'+KB.map(([k, t]) => '<div style="display:flex;justify-content:space-between;gap:14px;padding:3px 0"><b style="color:var(--acc);font:600 11px ui-monospace,monospace">'+k+'</b><span>'+esc(CFG.ar ? t[1] : t[0])+'</span></div>').join("")+'</div>';
$("kb").onclick = () => { if (openId === "kbPop") closeAll(); else { openPop("kbPop", 50 + 260); $("kbPop").style.right = "4px"; } };
function kbAct(e){

{ // every outside site in ONE menu ("Resources"); Finviz chart patterns as a sub-list

$("track").innerHTML = line + line; $("track").style.setProperty("--dur", Math.max(40, Math.round(news.reduce((a,n) => a + (n.headline||"").length, 0)/9))+"s");

$("tick").onclick = () => { if (openId === "newsPop") closeAll(); else openPop("newsPop", 54 + 366); };

/* ---- clocks ---- */
const fmtC = new Intl.DateTimeFormat("en-GB", {timeZone:"Africa/Cairo", hour12:false, hour:"2-digit", minute:"2-digit", second:"2-digit"});

const tickClk = () => { const n = new Date(), k = window.innerWidth < 700 ? 5 : 8; $("tc").textContent = fmtC.format(n).slice(0, k); $("tn").textContent = fmtN.format(n).slice(0, k); };   // phones: no seconds
tickClk(); setInterval(tickClk, 1000);
/* ---- world map ---- */
const CATS = {conflict:["#f6465d","Conflict / attack"], quake:["#ff9800","Earthquake"], fire:["#ffd54f","Wildfire"], storm:["#b57cff","Storm / cyclone"], volcano:["#a1887f","Volcano"], other:["#4aa3ff","Other"]};
const WM = {events:[], on:new Set(Object.keys(CATS)), sel:null, land:null, loaded:false, shape:null};

$("wm").onclick = () => { if (openId === "wmPop"){ closeAll(); return; } openPop("wmPop", 54 + 560); if (!WM.loaded) wmLoad(); wmDraw(); };
const proj = (lon, lat, W, H) => [(lon+180)/360*W, (90-lat)/180*H];
function wmDraw(){

  c.strokeStyle = "#1b232c"; c.lineWidth = 1; for (let lon = -180; lon <= 180; lon += 30){ const [x] = proj(lon,0,W,H); c.beginPath(); c.moveTo(x,0); c.lineTo(x,H); c.stroke(); }
  for (let lat = -60; lat <= 90; lat += 30){ const [,y] = proj(0,lat,W,H); c.beginPath(); c.moveTo(0,y); c.lineTo(W,y); c.stroke(); }
  if (WM.land){ c.fillStyle = "#1c2733"; c.strokeStyle = "#2f3f4f"; WM.land.forEach(ring => { c.beginPath(); ring.forEach(([lo,la],i) => { const [x,y] = proj(lo,la,W,H); i ? c.lineTo(x,y) : c.moveTo(x,y); }); c.closePath(); c.fill(); c.stroke(); }); }

    const [x,y] = proj(e.lon, e.lat, W, H), col = CATS[e.cat][0], r = e === WM.sel ? 8 : 4.5;
    c.fillStyle = col; c.globalAlpha = .35; c.beginPath(); c.arc(x,y,r+4,0,6.3); c.fill(); c.globalAlpha = 1; c.beginPath(); c.arc(x,y,r,0,6.3); c.fill();
    if (e === WM.sel){ c.strokeStyle = "#fff"; c.lineWidth = 2; c.stroke(); c.lineWidth = 1; }
  });
}
function wmList(){
  if (sideMode === "cal") return;
  const evs = WM.events.filter(e => WM.on.has(e.cat)).slice(0, 80);
  $("side").innerHTML = evs.length ? evs.map((e,i) => '<div class="ev'+(e === WM.sel ? " sel" : "")+'" data-i="'+WM.events.indexOf(e)+'"><span class="dot" style="background:'+CATS[e.cat][0]+'"></span>'+esc(e.title)+'<div style="color:var(--mut);font-size:10px">'+esc(e.when||"")+'</div></div>').join("") : '<div style="padding:8px;color:var(--mut)">No events loaded (yet).</div>';
}
$("side").addEventListener("click", e => { const d = e.target.closest(".ev"); if (d) wmSelect(WM.events[+d.dataset.i]); });
$("cv").addEventListener("click", e => {
  const cv = $("cv"), r = cv.getBoundingClientRect(), x = (e.clientX-r.left)*cv.width/r.width, y = (e.clientY-r.top)*cv.height/r.height;
  let best = null, bd = 18; WM.events.filter(v => WM.on.has(v.cat)).forEach(v => { const [px,py] = proj(v.lon,v.lat,cv.width,cv.height), d = Math.hypot(px-x,py-y); if (d < bd){ bd = d; best = v; } });
  if (best) wmSelect(best);
});
async function wmSelect(e){
  if (!e) return; WM.sel = e; wmDraw(); wmList();
  const links = (safe(e.url) ? '<a target="_blank" rel="noopener noreferrer" href="'+esc(safe(e.url))+'">Source ↗</a> · ' : "")
    +'<a target="_blank" rel="noopener noreferrer" href="https://news.google.com/search?q='+encodeURIComponent(e.title)+'">News ↗</a> · <a target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/results?search_query='+encodeURIComponent(e.title+" live")+'">Video ↗</a>';
  const pop = $("evpop"); pop.style.display = "block";
  pop.innerHTML = '<span class="x" id="evx">✕</span><h4 style="color:'+CATS[e.cat][0]+'">'+esc(e.title)+'</h4><div style="color:var(--mut);margin-bottom:6px">'+esc(CATS[e.cat][1])+' · '+esc(e.when||"")+' · '+e.lat.toFixed(2)+', '+e.lon.toFixed(2)+' · '+esc(e.src)+'</div>'+(e.desc ? '<div style="margin-bottom:6px">'+esc(e.desc)+'</div>' : "")+'<div>'+links+'</div><div id="hl" style="margin-top:8px;color:var(--mut)">Loading related headlines…</div>';
  $("evx").onclick = () => { pop.style.display = "none"; };
  try {
    const q = encodeURIComponent(e.title.replace(/^M[\d.]+\s+/, "").slice(0, 80));
    const d = await jget("https://api.gdeltproject.org/api/v2/doc/doc?query="+q+"&mode=ArtList&format=json&maxrecords=6&sort=DateDesc");
    const arts = (d.articles || []).slice(0, 6);
    $("hl").innerHTML = arts.length ? '<b style="color:var(--txt)">Related headlines</b>'+arts.map(a => '<div class="hl"><a target="_blank" rel="noopener noreferrer" href="'+esc(safe(a.url))+'">'+esc(a.title)+'</a><div style="font-size:10px">'+esc(a.domain||"")+'</div></div>').join("") : "No related headlines found.";
  } catch(err){ const h = $("hl"); if (h) h.textContent = "Related headlines unavailable here — use the News / Video links."; }
}
function topoRings(t){   // minimal TopoJSON (world-atlas) decoder -> polygon rings in lon/lat
  const [sx,sy] = t.transform.scale, [tx,ty] = t.transform.translate;
  const arcs = t.arcs.map(a => { let x = 0, y = 0; return a.map(([dx,dy]) => { x += dx; y += dy; return [x*sx+tx, y*sy+ty]; }); });
  const ring = idx => { let pts = []; idx.forEach(i => { const a = i < 0 ? arcs[~i].slice().reverse() : arcs[i]; pts = pts.concat(pts.length ? a.slice(1) : a); }); return pts; };
  const out = []; const obj = t.objects.countries || t.objects.land;
  (obj.geometries || [obj]).forEach(g => { if (g.type === "Polygon") g.arcs.forEach(r => out.push(ring(r))); else if (g.type === "MultiPolygon") g.arcs.forEach(p => p.forEach(r => out.push(ring(r)))); });
  return out;
}
const ago = t => { const m = Math.round((Date.now()-t)/60000); return m < 60 ? m+" min ago" : m < 1440 ? Math.round(m/60)+" h ago" : Math.round(m/1440)+" d ago"; };
async function jget(u){ const r = await fetch(u, {cache:"no-store"}); if (!r.ok) throw new Error("HTTP "+r.status); return r.json(); }
async function wmLoad(){
  WM.loaded = true; const msgs = [];
  const jobs = [
    jget("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json").then(t => { WM.land = topoRings(t); }).catch(() => msgs.push("map outline")),
    jget("https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.geojson").then(g => g.features.forEach(f => { const [lon,lat] = f.geometry.coordinates; WM.events.push({cat:"quake", lat, lon, title:"M"+(+f.properties.mag).toFixed(1)+" "+f.properties.place, when:ago(f.properties.time), t:f.properties.time, src:"USGS", url:f.properties.url, desc:""}); })).catch(() => msgs.push("USGS")),
    jget("https://eonet.gsfc.nasa.gov/api/v3/events?status=open&limit=80").then(g => g.events.forEach(ev => { const geo = ev.geometry[ev.geometry.length-1]; if (!geo || geo.type !== "Point") return; const cid = (ev.categories[0]||{}).id || "";
        const cat = /wildfire/i.test(cid) ? "fire" : /storm/i.test(cid) ? "storm" : /volcano/i.test(cid) ? "volcano" : "other";
        WM.events.push({cat, lat:geo.coordinates[1], lon:geo.coordinates[0], title:ev.title, when:ago(Date.parse(geo.date)), t:Date.parse(geo.date), src:"NASA EONET", url:(ev.sources[0]||{}).url || ev.link, desc:(ev.categories[0]||{}).title||""}); })).catch(() => msgs.push("NASA EONET")),
    jget("https://api.gdeltproject.org/api/v2/geo/geo?query=(attack%20OR%20missile%20OR%20airstrike%20OR%20shelling%20OR%20war)&mode=PointData&format=GeoJSON&timespan=24H&maxpoints=60").then(g => (g.features||[]).forEach(f => { const [lon,lat] = f.geometry.coordinates, p = f.properties || {}; WM.events.push({cat:"conflict", lat, lon, title:p.name || "Conflict reports", when:"last 24h", t:Date.now(), src:"GDELT", url:"", desc:String(p.html||"").replace(/<[^>]+>/g," ").slice(0,300)}); })).catch(() => msgs.push("GDELT"))
  ];
  await Promise.allSettled(jobs);
  WM.events.sort((a,b) => b.t - a.t); $("st").textContent = msgs.length ? "(could not load: "+msgs.join(", ")+")" : ""; wmDraw(); wmList();
}
/* ---- economic calendar (server data CFG.cal, else fetched here) + news alert bell ---- */
let CAL = null, sideMode = "ev", audioOK = false, beeped = {};
document.addEventListener("pointerdown", () => { audioOK = true; }, {once:true});
async function calData(){
  if (CAL) return CAL;
  if (CFG.cal && CFG.cal.length){ CAL = CFG.cal; return CAL; }
  const rows = await jget("https://nfs.faireconomy.media/ff_calendar_thisweek.json");
  CAL = rows.filter(e => /high|medium/i.test(e.impact)).map(e => ({title:e.title, country:e.country, ts:Date.parse(e.date), impact:/high/i.test(e.impact) ? "High" : "Medium", forecast:e.forecast||"", previous:e.previous||""})).sort((a,b) => a.ts-b.ts);
  return CAL;
}
document.querySelectorAll('input[name=sv]').forEach(r => r.onchange = () => { sideMode = r.value; if (sideMode === "cal") calLoad(); else wmList(); });
const cairoFmt = new Intl.DateTimeFormat("en-GB", {timeZone:"Africa/Cairo", weekday:"short", hour:"2-digit", minute:"2-digit", hour12:false});
async function calLoad(){
  $("side").innerHTML = '<div style="padding:8px;color:var(--mut)">Loading…</div>';
  let cal; try { cal = await calData(); } catch(e){ $("side").innerHTML = '<div style="padding:8px;color:var(--mut)">Calendar feed not reachable ('+esc(e.message||e)+'). Use the ForexFactory link.</div>'; return; }
  const now = Date.now();
  const opts = [[0, CFG.ar ? "بدون منبّه" : "no alarm"], [15, "15m"], [60, "1h"], [120, "2h"], [240, "4h"], [720, "12h"]];
  const head = '<div class="ev" style="cursor:default"><b>'+(CFG.ar ? "منبّه البث المباشر" : "Live-stream alarm")+'</b> <select id="naLead">'+opts.map(([v, t]) => '<option value="'+v+'"'+(NA.lead == v ? " selected" : "")+'>'+t+'</option>').join("")+'</select> '+
    '<label style="white-space:nowrap"><input type="checkbox" id="naOpen"'+(NA.open ? " checked" : "")+'> '+(CFG.ar ? "افتح البث وقت الخبر" : "open the stream at the start")+'</label></div>';
  $("side").innerHTML = head + cal.map(e => { const col = e.impact === "High" ? "#f6465d" : "#f0b90b", d = e.ts - now, soon = d > -600000 && d < 172800000, Lv = liveFor(e);
    return '<div class="ev" style="'+(d < -600000 ? "opacity:.45" : "")+'"><span class="dot" style="background:'+col+'"></span><b>'+esc(e.country)+'</b> '+esc(e.title)+(soon && e.impact === "High" ? ' <span style="color:#f6465d">●</span>' : "")+'<div style="color:var(--mut);font-size:10px">'+cairoFmt.format(e.ts)+' Cairo · fcst '+esc(e.forecast||"-")+' · prev '+esc(e.previous||"-")+(Lv && e.impact === "High" ? ' · <a href="'+Lv[0]+'" target="_blank" rel="noopener noreferrer" style="color:#f6465d">▶ '+(CFG.ar ? "بث" : "live")+' ('+esc(Lv[1])+')</a>' : "")+'</div></div>'; }).join("") || '<div style="padding:8px;color:var(--mut)">No events.</div>';
  const nl = document.getElementById("naLead"), no = document.getElementById("naOpen");
  if (nl) nl.onchange = () => { NA.lead = +nl.value; naSave(); try { if (NA.lead && window.Notification && Notification.permission === "default") Notification.requestPermission(); } catch(_){} };   // user click = allowed to ask for notifications
  if (no) no.onchange = () => { NA.open = no.checked; naSave(); };
}
/* ---- live streams for big news: alarm N hours before, open the stream at the start ---- */
// the channel's "/live" page = its current live stream (YouTube); when nothing is live YouTube shows the channel, so the link says "may be live"
function liveFor(e){ const t = (e.title || "") + " " + (e.country || "");
  if (/FOMC|Fed |Federal Funds|Powell|Fed Chair|Monetary Policy Statement/i.test(t) && /USD/.test(t)) return ["https://www.youtube.com/@federalreserve/live", "Federal Reserve"];
  if (/ECB|Lagarde|Main Refinancing|Monetary Policy/i.test(t) && /EUR/.test(t)) return ["https://www.youtube.com/@europeancentralbank/live", "ECB"];
  if (/BOE|Bank Rate|Bailey|MPC|Monetary Policy/i.test(t) && /GBP/.test(t)) return ["https://www.youtube.com/@bankofengland/live", "Bank of England"];
  if (e.impact === "High") return ["https://www.youtube.com/@markets/live", "Bloomberg TV"];
  return null; }
const NA = Object.assign({lead:60, open:true}, (() => { try { return JSON.parse(localStorage.getItem("xpix_news_alarm") || "{}"); } catch(_){ return {}; } })());
const naSave = () => { try { localStorage.setItem("xpix_news_alarm", JSON.stringify(NA)); } catch(_){} };
const alarmed = {}, opened = {};
function notify(title, body, url){ try { if (window.Notification && Notification.permission === "granted"){ const n = new Notification(title, {body, tag:title}); if (url) n.onclick = () => { window.open(url, "_blank", "noopener"); n.close(); }; } } catch(_){} }
function openLive(url){ const w = window.open(url, "_blank", "noopener"); return !!w; }
function beep(){ if (!audioOK) return; try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value = 880; g.gain.value = .15; o.start(); o.stop(a.currentTime + .35); } catch(e){} }
async function bellTick(){
  let cal; try { cal = await calData(); } catch(e){ $("bell").textContent = "🔔 calendar n/a"; return; }
  const now = Date.now(), nx = cal.find(e => e.impact === "High" && e.ts > now - 300000);
  const b = $("bell"); b.classList.remove("hot","blink");
  const dkey = t => new Intl.DateTimeFormat("en-CA", {timeZone:"Africa/Cairo"}).format(t), hi = cal.filter(e => e.impact === "High" && e.ts > now - 300000),
    nToday = hi.filter(e => dkey(e.ts) === dkey(now)).length, nTom = hi.filter(e => dkey(e.ts) === dkey(now+86400000)).length, nWeek = hi.length;
  const cnt = " · today "+nToday+" · tomorrow "+nTom+" · week "+nWeek;
  if (!nx){ b.textContent = "🔔 no high-impact news"+cnt; return; }
  const d = nx.ts - now, m = Math.round(d/60000), txt = d < 0 ? "now" : m < 60 ? m+"m" : Math.floor(m/60)+"h "+(m%60)+"m", day = new Date(nx.ts).toDateString() === new Date().toDateString() ? "today" : "later";
  b.textContent = "🔔 "+nx.country+" "+nx.title+" · "+(d < 0 ? "NOW" : "in "+txt); b.textContent += cnt;  b.title = cairoFmt.format(nx.ts)+" Cairo — "+nx.title+" ("+day+"); high-impact events: today "+nToday+", tomorrow "+nTom+", this week "+nWeek;
  if (d < 3600000) b.classList.add("hot"); if (d < 900000) b.classList.add("blink");
  const k = nx.ts+"|15"; if (d < 900000 && d > 0 && !beeped[k]){ beeped[k] = 1; beep(); }

  cal.filter(e => e.impact === "High" && e.ts > now - 1800000).forEach(e => { const L = liveFor(e); if (!L) return; const dd = e.ts - now, key = e.ts+"|"+e.title;
    if (NA.lead && dd > 0 && dd <= NA.lead*60000 && !alarmed[key]){ alarmed[key] = 1; beep(); notify("⏰ "+e.country+" "+e.title, (CFG.ar ? "بعد " : "in ")+Math.round(dd/60000)+(CFG.ar ? " دقيقة · بث: " : " min · live: ")+L[1], L[0]); }
    if (dd <= 0 && dd > -1800000){ b.dataset.live = L[0]; b.textContent = "▶ "+(CFG.ar ? "البث المباشر: " : "LIVE: ")+e.country+" "+e.title+" ("+L[1]+")"; b.classList.add("hot","blink");
      if (NA.open && !opened[key]){ opened[key] = 1; openLive(L[0]); } } });
}
$("bell").onclick = () => { if ($("bell").dataset.live){ openLive($("bell").dataset.live); return; } if (openId !== "wmPop") $("wm").click(); document.querySelector('input[name=sv][value=cal]').checked = true; sideMode = "cal"; calLoad(); };

window.__wm = WM;
