# Grok (xAI) watch: one request every 6 hours (4 a day) plus manual runs. Saved as an artifact and a run summary (not committed). Cap: one request, 900 output tokens.
name: Grok digest
on:
  # owner 2026-10-28: no paid API (Grok / Claude) - the 6-hourly schedule is OFF; run it by hand only when the owner says so.
  # schedule:
  #   - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Ask Grok once
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          python -m modules.grok_digest
          python -c "import json;print(json.load(open('grok_digest.json'))['digest'])"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: grok-digest
          path: grok_digest.json
          if-no-files-found: error
