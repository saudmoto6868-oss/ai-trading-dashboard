name: Real-candle backtests (manual)

on:
  workflow_dispatch: {}   # only when the owner presses "Run workflow"

permissions:
  contents: read          # results go to artifacts, never to the repo

jobs:
  backtests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas numpy requests
      - name: Filters (direction hit-rate, no costs yet)
        continue-on-error: true
        run: python -m modules.backtest_filters
      - name: Signals (direction hit-rate, no costs yet)
        continue-on-error: true
        run: python -m modules.backtest_signals
      - name: Best timeframe (per strategy)
        continue-on-error: true
        timeout-minutes: 60
        run: python -m modules.backtest_tf
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: backtest-real-${{ github.run_id }}
          path: |
            data/*.json
            *.md
          if-no-files-found: warn
