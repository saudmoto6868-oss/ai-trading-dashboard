name: Daily baseline calls (record + score)

on:
  schedule:
    - cron: "10 22 * * *"          # daily, after the US close (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: forecast-daily
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas numpy requests
      - name: Record today's baseline calls, then score the due ones
        run: |
          python -m modules.daily_forecast --record --score
      - name: Save the results on the forecast-log branch (never on main or the PR branch)
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/out"
          cp -r data/forecasts "$RUNNER_TEMP/out/" && cp docs/forecasts/SUMMARY.md "$RUNNER_TEMP/out/" 2>/dev/null || true
          git config user.name "forecast bot"
          git config user.email "actions@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin forecast-log >/dev/null 2>&1; then
            git fetch -q origin forecast-log && git checkout -q -B forecast-log FETCH_HEAD
          else
            git checkout -q --orphan forecast-log && git rm -rfq . || true
          fi
          mkdir -p data docs/forecasts
          rm -rf data/forecasts && cp -r "$RUNNER_TEMP/out/forecasts" data/forecasts
          [ -f "$RUNNER_TEMP/out/SUMMARY.md" ] && cp "$RUNNER_TEMP/out/SUMMARY.md" docs/forecasts/SUMMARY.md
          git add -A data docs
          git diff --cached --quiet && exit 0
          git commit -q -m "Daily baseline calls $(date -u +%F)"
          git push -q origin HEAD:forecast-log
