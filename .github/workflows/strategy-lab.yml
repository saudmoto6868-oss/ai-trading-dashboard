name: Strategy lab

on:
  schedule:
    - cron: "17 3 * * 0"        # weekly, Sunday 03:17 UTC
  workflow_dispatch: {}          # "Run workflow" button

permissions:
  contents: write                # commits STRATEGY_LAB.md + data/strategy_lab.json

concurrency:
  group: strategy-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas numpy requests
      - name: Walk-forward every detector on real candles
        run: python -m modules.strategy_lab
      - name: Best-timeframe table for the Workspace (too heavy for Streamlit Cloud)
        continue-on-error: true
        timeout-minutes: 40
        run: python -m modules.backtest_tf
      - name: Item 1 - Group-A filters ON vs OFF
        continue-on-error: true
        timeout-minutes: 80
        run: python -m modules.backtest_filters
      - name: Commit the results
        run: |
          git config user.name "strategy-lab bot"
          git config user.email "actions@users.noreply.github.com"
          git add STRATEGY_LAB.md data/strategy_lab.json
          for f in FILTER_COMPARE.md data/filter_compare.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if [ -f data/tf_stats.json ]; then git add -f data/tf_stats.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "Strategy lab results $(date -u +%F)"
          # the generated files are the bot's: on a conflict keep the fresh results (-X theirs = this commit during a rebase); fail loudly if the push never lands
          ok=0; for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && { ok=1; break; }; git rebase --abort 2>/dev/null || true; sleep 5; done
          [ "$ok" = 1 ] || { echo "results NOT pushed"; exit 1; }
