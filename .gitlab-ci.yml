# Scheduled Telegram jobs stay restricted to schedules/manual runs.
# The integration branch also runs isolated unit tests on push.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "integration/tia-knowledge-center-2026-11-09"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

default:
  image: python:3.12-slim
  interruptible: false

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

telegram_alerts:
  stage: test
  timeout: 15m
  resource_group: telegram-alerts
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  cache:
    - key: pip-312
      paths:
        - .cache/pip
    - key: tg-state
      paths:
        - .tg_sent.json
        - .tc_sent.json
        - .brain_sent.json
        - .brain_log.jsonl
        - .brain_graded.json
        - .brain_agents.jsonl
        - .signal_log.jsonl
      when: always
  before_script:
    - pip install --quiet pandas numpy requests tzdata
  script:
    - python -m modules.tg_cron || true
    - python -m modules.tclass_cron || true
    - python -m modules.brain_cron
    - python -m modules.signal_log || true
  artifacts:
    when: always
    paths:
      - .signal_log.jsonl
    expire_in: 90 days
    exclude:
      - .cache/**/*

intelligence_unit_tests:
  stage: test
  timeout: 10m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "integration/tia-knowledge-center-2026-11-09"'
  before_script:
    - python -m pip install --quiet --upgrade pip
    - python -m pip install --quiet pytest
  script:
    - python -m pytest -q tests/test_academy_intelligence.py tests/test_intelligence_meeting.py
