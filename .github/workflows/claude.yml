# @claude on an issue / PR comment (works from the GitHub phone app, or /order in the XPiX Telegram bot = meeting room):
# Claude Code works on this repo. Billing: if secret CLAUDE_CODE_OAUTH_TOKEN is set (`claude setup-token` on the owner's
# Claude Team account) it uses the SUBSCRIPTION limits, no API money; otherwise the Console API key (ANTHROPIC_API_KEY).
name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  claude:
    # owner 2026-10-28: no paid Anthropic API by default. The job runs only when the repo variable CLAUDE_ACTION_ENABLED is 'true' (Settings > Secrets and variables > Actions > Variables),
    # and only for the owner / members / collaborators (a public repo: any stranger's '@claude' comment must not spend the credit).
    if: >-
      (vars.CLAUDE_ACTION_ENABLED == 'true' || vars.CLAUDE_SUBSCRIPTION == 'true') &&
      contains(github.event.comment.body || github.event.issue.body || '', '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.issue.author_association || 'NONE')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 1
      # quick key check: prints only the HTTP status + error type (never the key), so a bad key / no credit is obvious in the log
      - name: Check Anthropic key
        env:
          K: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          [ -z "$OAUTH" ] || { echo "subscription token set (Claude Team) - no API key needed"; exit 0; }
          [ -n "$K" ] || { echo "::error::secret ANTHROPIC_API_KEY is empty / missing"; exit 1; }
          # shape only (first 10 chars = the key type, never the secret part): catches a wrong key type, quotes, spaces or a cut copy
          echo "key starts with: ${K:0:10}  length: ${#K}  spaces/newlines: $(printf '%s' "$K" | tr -cd ' \n\r\t' | wc -c)  quotes: $(printf '%s' "$K" | tr -cd '"\047' | wc -c)"
          code=$(curl -s -o r.json -w '%{http_code}' https://api.anthropic.com/v1/messages -H "x-api-key: $K" -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" -d '{"model":"claude-haiku-5-5","max_tokens":5,"messages":[{"role":"user","content":"hi"}]}')
          echo "Anthropic API status: $code"; python3 -c "import json;d=json.load(open('r.json'));print('error:', (d.get('error') or {}).get('type'), (d.get('error') or {}).get('message'))" || true
          rm -f r.json; [ "$code" = "200" ] || { echo "::error::Anthropic key check failed ($code) - see the error line above"; exit 1; }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - uses: anthropics/claude-code-action@4845bacbb38b3c4b15d948f035349786f678e068  # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          # Sonnet: good for code work and much cheaper than the default; python allowed so it can run the tests
          claude_args: '--max-turns 40 --model claude-sonnet-5-5 --allowedTools "Bash(python3:*),Bash(python:*),Bash(pip install:*),Bash(git fetch origin claude/issue-9-20261021-1523),Bash(git merge origin/claude/issue-9-20261021-1523),Edit,Write"'
      - name: Tell the owner on Telegram (XPiX bot)
        if: always()
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          URL: ${{ github.event.issue.html_url || github.event.pull_request.html_url }}
          STATUS: ${{ job.status }}
        run: |
          [ -n "$TG" ] && [ -n "$CHAT" ] || exit 0
          [ "$STATUS" = success ] && T="✅ Claude Code خلص الأوردر، شوف الرد" || T="⚠️ Claude Code وقف ($STATUS)"
          curl -sS "https://api.telegram.org/bot${TG}/sendMessage" --data-urlencode "chat_id=${CHAT}" --data-urlencode "text=${T}: ${URL}" > /dev/null
