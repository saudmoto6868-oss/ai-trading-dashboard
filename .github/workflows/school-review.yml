# Manual: ask Gemini (and DeepSeek / OpenAI if their secrets exist) to review the trading schools; saves docs/reviews/*.md
name: School review
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: school-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Ask the models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m modules.school_review
      - name: Commit reviews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reviews
          git diff --cached --quiet && exit 0
          git commit -m "School reviews from external models (not evidence)"
          # main moves while the models run (other commits, the lab bot): rebase onto it and retry; the generated reviews are this run's, so keep them on a conflict
          ok=0; for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && { ok=1; break; }; git rebase --abort 2>/dev/null || true; sleep 5; done
          [ "$ok" = 1 ] || { echo "reviews NOT pushed"; exit 1; }
