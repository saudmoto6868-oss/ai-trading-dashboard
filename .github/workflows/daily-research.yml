name: Daily strategy research

on:
  schedule:
    - cron: "17 5 * * *"        # every day 05:17 UTC (before London); GitHub may delay scheduled runs
  workflow_dispatch: {}          # "Run workflow" button

permissions:
  contents: write

concurrency:
  group: daily-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Read public sources, summarise with the first model that has a key (Gemini / OpenRouter free / ChatGPT / DeepSeek)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m modules.daily_research
      - name: Commit the note
        run: |
          git config user.name "xpix-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/research/daily || true
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Daily strategy research $(date -u +%F)"
          ok=0; for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && { ok=1; break; }; git rebase --abort 2>/dev/null || true; sleep 5; done
          [ $ok = 1 ]
