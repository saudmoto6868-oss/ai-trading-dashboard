<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0">
<script>
/* XPiX guide bridge (hidden Streamlit component). The workspace frame (same origin) calls window.__xpixBridge.ask({id,q,ctx});
   the question goes to Python, the answer comes back as a render arg and is handed to every frame that has __xpixGuideAnswer. */
(function(){
  const send = (type, extra) => window.parent.postMessage(Object.assign({isStreamlitMessage:true, type}, extra || {}), "*");
  let lastAns = null;
  window.__xpixBridge = { ai:false, live:false, ask(req){ send("streamlit:setComponentValue", {value:req, dataType:"json"}); return true; } };
  window.addEventListener("message", ev => {
    const d = ev.data || {}; if (d.type !== "streamlit:render") return;
    const a = (d.args || {}); window.__xpixBridge.ai = !!a.ai; window.__xpixBridge.live = !!a.live;
    const ans = a.ans; if (!ans || !ans.id || ans.id === lastAns) return; lastAns = ans.id;
    let fs = []; try { fs = Array.from(window.parent.frames); } catch(e){}
    fs.forEach(f => { try { if (f.__xpixGuideAnswer) f.__xpixGuideAnswer(ans); } catch(e){} });
  });
  send("streamlit:componentReady", {apiVersion:1}); send("streamlit:setFrameHeight", {height:0});
})();
</script></body></html>
