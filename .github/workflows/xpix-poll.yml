name: XPiX poller

on:
  schedule:
    - cron: "*/5 * * * *"        # every 5 minutes (GitHub may delay scheduled runs)
  workflow_dispatch: {}           # "Run workflow" button for a manual test

permissions:
  contents: read                  # reads the repo only; never pushes

concurrency:
  group: xpix-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Restore Telegram update offset
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: data/xpix_poll_state.json
          key: xpix-poll-${{ github.run_id }}
          restore-keys: xpix-poll-
      - name: Answer owner messages
        env:
          XPIX_BOT_TOKEN: ${{ secrets.XPIX_BOT_TOKEN }}
          XPIX_OWNER_CHAT_ID: ${{ secrets.XPIX_OWNER_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/xpix_poll.py
      - name: Save Telegram update offset
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: data/xpix_poll_state.json
          key: xpix-poll-${{ github.run_id }}
