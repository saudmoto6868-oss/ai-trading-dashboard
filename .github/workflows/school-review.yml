# Ask external models to review the schools and our daily-calls record; saves docs/reviews/*.md (opinions, not evidence).
# owner 2026-11-24: free first, paid as an option. The weekly schedule runs the FREE tier on the daily-calls review only
# (Gemini on the key's free tier + OpenRouter ":free" models). DeepSeek (paid) runs only when "paid" is picked by hand.
name: School review
on:
  schedule:
    - cron: "41 6 * * 0"          # weekly, Sunday 06:41 UTC: free tier, daily-calls review
  workflow_dispatch:
    inputs:
      tier:
        description: "free (Gemini + OpenRouter free models) or paid (adds DeepSeek)"
        required: false
        default: "free"
        type: choice
        options: [free, paid]
      topics:
        description: "topics, space-separated (empty = calls_review on schedule, all topics by hand)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: school-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Ask the models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SCHOOL_REVIEW_TIER: ${{ github.event.inputs.tier || 'free' }}
          TOPICS: ${{ github.event.inputs.topics || (github.event_name == 'schedule' && 'calls_review' || '') }}
        run: python -m modules.school_review $TOPICS
      - name: Commit reviews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reviews
          git diff --cached --quiet && exit 0
          git commit -m "School reviews from external models (not evidence)"
          # main moves while the models run (other commits, the lab bot): rebase onto it and retry; the generated reviews are this run's, so keep them on a conflict
          ok=0; for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && { ok=1; break; }; git rebase --abort 2>/dev/null || true; sleep 5; done
          [ "$ok" = 1 ] || { echo "reviews NOT pushed"; exit 1; }
