# Grok (xAI) watch: one request every 6 hours (4 a day) plus manual runs. Saved as an artifact and a run summary (not committed). Cap: one request, 900 output tokens.
name: Grok digest
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Ask Grok once
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          python -m modules.grok_digest
          python -c "import json;print(json.load(open('grok_digest.json'))['digest'])"
      - uses: actions/upload-artifact@v4
        with:
          name: grok-digest
          path: grok_digest.json
          if-no-files-found: error
