name: Telegram alerts

on:
  schedule:
    - cron: "*/30 * * * *"      # every 30 minutes (GitHub may delay scheduled runs by several minutes)
  workflow_dispatch: {}          # "Run workflow" button for a manual test

permissions:
  contents: read

concurrency:
  group: telegram-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas numpy requests tzdata
      - name: Restore what was already sent
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4 (restore + save split 2026-11-20: a failed step must not drop the learning state)
        with:
          path: |
            .tg_sent.json
            .tc_sent.json
            .brain_sent.json
            .brain_log.jsonl
            .brain_graded.json
            .signal_log.jsonl
          key: tg-sent-${{ github.run_id }}
          restore-keys: tg-sent-
      - name: Scan, rank, send the best alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m modules.tg_cron
      - name: Trade Classes bounce trades (Day trade + Swing, price at a support / resistance zone)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m modules.tclass_cron
      - name: Brain (event heads-ups, setup alerts, Top 7 of the day, daily review) - modules/brain_cron.py
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m modules.brain_cron
      - name: Spot desk alerts (online ledger; skipped when SPOT_GH_* are not set)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SPOT_GH_TOKEN: ${{ secrets.SPOT_GH_TOKEN }}
          SPOT_GH_REPO: ${{ secrets.SPOT_GH_REPO }}
        run: python -m modules.spot_alerts_cron
      - name: Workspace price alarms (the chart's alerts, page closed; skipped when SPOT_GH_* are not set) - modules/palarm_server.py
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SPOT_GH_TOKEN: ${{ secrets.SPOT_GH_TOKEN }}
          SPOT_GH_REPO: ${{ secrets.SPOT_GH_REPO }}
        run: python -m modules.palarm_server
      - name: Signal log (stats + artifact)
        if: always()
        run: python -m modules.signal_log
      - name: Save sent memory, brain log, graded ideas, signal log (always, even if a step failed)
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            .tg_sent.json
            .tc_sent.json
            .brain_sent.json
            .brain_log.jsonl
            .brain_graded.json
            .signal_log.jsonl
          key: tg-sent-${{ github.run_id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: signal-log
          path: .signal_log.jsonl
          include-hidden-files: true   # v4 skips dot-files by default: the signal log was never uploaded
          if-no-files-found: ignore
          retention-days: 90
