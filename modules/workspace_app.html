async function okx(path){
  const r = await fetch(API + "/api/v5" + path, {cache:"no-store"});
  if (!r.ok) throw new Error("HTTP "+r.status);
  const j = await r.json();
  if (j.code !== "0") throw new Error(j.msg || ("code "+j.code));
  return j.data;
}
function setStatus(ok){ const d = document.getElementById("dot"); if (!d) return; d.className = ok ? "ok" : "bad"; d.title = ok ? T("live") : T("offline"); }

/* ---------------- OKX WebSocket (live ticks; REST polling keeps running as a fallback) ---------------- */
const WSX = {
  conns:{}, subs:{},
  conn(kind){
    let c = this.conns[kind]; if (c) return c;
    c = this.conns[kind] = {ws:null, ready:false, kind};
    const open = () => {
      let ws; try { ws = new WebSocket(WSB + "/" + kind); } catch(e){ return setTimeout(open, 5000); }
      c.ws = ws;
      ws.onopen = () => { c.ready = true; Object.values(this.subs).filter(x => x.kind === kind).forEach(x => ws.send(JSON.stringify({op:"subscribe", args:[x.arg]})));
        c.ping = setInterval(() => { try{ ws.send("ping"); }catch(e){} }, 20000); };
      ws.onmessage = ev => {
        if (ev.data === "pong") return;
        let m; try { m = JSON.parse(ev.data); } catch(e){ return; }
        if (!m.arg || !m.data) return;
        const x = this.subs[JSON.stringify(m.arg)]; if (x) x.cbs.forEach(cb => { try{ cb(m.data); }catch(e){ console.error(e); } });
      };
      ws.onclose = () => { c.ready = false; clearInterval(c.ping); setTimeout(open, 3000); };
      ws.onerror = () => { try{ ws.close(); }catch(e){} };
    };
    open(); return c;
  },
  sub(kind, arg, cb){
    const c = this.conn(kind), key = JSON.stringify(arg);
    const x = this.subs[key] = this.subs[key] || {arg, kind, cbs:new Set()};
    x.cbs.add(cb);
    if (c.ready && x.cbs.size === 1) c.ws.send(JSON.stringify({op:"subscribe", args:[arg]}));
    return () => { x.cbs.delete(cb); if (!x.cbs.size){ delete this.subs[key]; if (c.ready) try{ c.ws.send(JSON.stringify({op:"unsubscribe", args:[arg]})); }catch(e){} } };
  }
};

/* ---------------- data hub (one poll per symbol/kind, shared by all widgets) ---------------- */
const Hub = {
  subs:{}, last:{}, timers:{}, an:{},
  sub(kind, sym, cb){
    const key = kind+"|"+sym;
    (this.subs[key] = this.subs[key] || new Set()).add(cb);
    if (this.last[key]) cb(this.last[key]);
    if (!this.timers[key]) this.start(key, kind, sym);
    return () => { const s = this.subs[key]; s.delete(cb); if (!s.size){ clearTimeout(this.timers[key]); delete this.timers[key]; delete this.last[key]; if (kind === "trades") delete this.an[sym]; } };
  },
  start(key, kind, sym){
    const every = kind === "tickers" ? 3000 : 1500;
    const tick = async () => {
      if (!this.subs[key] || !this.subs[key].size) return;
      try {
        let payload;
        if (kind === "book"){
          const d = (await okx("/market/books?instId="+encodeURIComponent(sym)+"&sz=50"))[0];
          payload = { bids:d.bids.map(x=>({p:+x[0],q:+x[1]})), asks:d.asks.map(x=>({p:+x[0],q:+x[1]})) };
        } else if (kind === "trades"){
          const d = await okx("/market/trades?instId="+encodeURIComponent(sym)+"&limit=100");
          payload = this.analyze(sym, d.map(x=>({id:x.tradeId, t:+x.ts, p:+x.px, q:+x.sz, side:x.side==="buy"?"Buy":"Sell"})).reverse());
        } else if (kind === "tickers"){
          const d = await okx("/market/tickers?instType=SPOT");
          const m = {}; d.forEach(x => m[x.instId] = {last:+x.last, open:+x.open24h}); payload = m;
        }
        this.last[key] = payload; setStatus(true);
        this.subs[key] && this.subs[key].forEach(cb => { try{ cb(payload); }catch(e){ console.error(e);} });
      } catch(e){ setStatus(false); this.subs[key] && this.subs[key].forEach(cb => { try{ cb({error:String(e.message||e)}); }catch(_){} }); }
      if (this.subs[key] && this.subs[key].size) this.timers[key] = setTimeout(tick, every);
    };
    this.timers[key] = setTimeout(tick, 0);
  },
  /* tape analysis: new-print flags, SMART/WHALE tiers, absorption, stats */
  analyze(sym, rows){
    const st = this.an[sym] = this.an[sym] || {seen:new Set(), first:true};
    const med = median(rows.map(r=>r.q)) || 1e-12;
    rows.forEach(r => {
      r.isNew = !st.first && !st.seen.has(r.id);
      r.tier = r.q >= settings.smart*2.5*med ? "whale" : r.q >= settings.smart*med ? "smart" : "normal";
      r.absorb = false; r.adir = "";
      r.notional = r.p*r.q;
    });
    rows.forEach(r => st.seen.add(r.id));
    if (st.seen.size > 800) st.seen = new Set(rows.map(r=>r.id));
    st.first = false;
    // absorption: heavy volume at ONE price while the window barely moved
    if (rows.length >= 10){
      const ps = rows.map(r=>r.p), lo = Math.min(...ps), hi = Math.max(...ps), mid = median(ps);
      if (mid > 0 && (hi-lo)/mid*100 <= 0.05){
        const lv = {};
        rows.forEach(r => { const o = lv[r.p] = lv[r.p] || {sum:0,n:0,buy:0,sell:0}; o.sum += r.q; o.n++; r.side==="Buy" ? o.buy += r.q : o.sell += r.q; });
        const m2 = median(Object.values(lv).map(o=>o.sum)) || 1e-12;
        rows.forEach(r => { const o = lv[r.p]; if (o.sum >= settings.absorb*m2 && o.n >= 4){ r.absorb = true; r.adir = o.buy >= o.sell ? "sellers" : "buyers"; } });
      }
    }
    const buy = rows.filter(r=>r.side==="Buy").reduce((a,r)=>a+r.q,0), sell = rows.filter(r=>r.side==="Sell").reduce((a,r)=>a+r.q,0);
    const span = rows.length ? (rows[rows.length-1].t - rows[0].t)/1000 : 0;
    const hits = {}; rows.filter(r=>r.isNew).forEach(r => hits[r.p] = r.side);
    st.map = st.map || new Map(); st.buf = st.buf || [];
    st.buf.forEach(b => b.isNew = false);
    rows.forEach(r => { const o = st.map.get(r.id); if (o){ o.tier = r.tier; o.absorb = r.absorb; o.adir = r.adir; o.isNew = r.isNew; } else { st.map.set(r.id, r); st.buf.push(r); } });
    if (st.buf.length > 3000){ st.buf.splice(0, 600).forEach(b => st.map.delete(b.id)); }
    const ab = new Set(rows.filter(r=>r.absorb).map(r=>r.p));
    return { rows, all: st.buf, hits, ab, abDir: (rows.find(r=>r.absorb)||{}).adir || "",
             stats:{ pace: span>0 ? rows.length/span : rows.length, buyPct: buy+sell ? 100*buy/(buy+sell) : 50, delta: buy-sell } };
  }
};

  for (let v = Math.ceil(lo/step)*step; v <= hi; v += step) out.push(v);
  return {ticks:out, step};
}

  let lo = null, hi = null; if (rows && rows.length){ const ps = rows.map(r=>r.p); lo = Math.min(...ps); hi = Math.max(...ps); }
  if (lt.prev){
    Object.keys(cur).forEach(k => { if (!(k in lt.prev)){ const [s,p] = k.split("|"); lt.events.unshift({t:now, ev:"PLACED", side:s, p:+p, q:cur[k]}); } });
    const bmin = Math.min(...book.bids.map(x=>x.p)), amax = Math.max(...book.asks.map(x=>x.p));
    Object.keys(lt.prev).forEach(k => {
      const [s,ps] = k.split("|"), p = +ps, old = lt.prev[k], nq = cur[k] || 0;
      if (s === "bid" && p < bmin) return; if (s === "ask" && p > amax) return;
      if (nq < 0.4*old){ const thru = (s==="ask" && hi != null && hi >= p) || (s==="bid" && lo != null && lo <= p); lt.events.unshift({t:now, ev:thru?"FILLED":"PULLED", side:s, p, q:old}); }
    });
  }
  lt.prev = cur; lt.events = lt.events.slice(0, 200);
}
function renderEvents(panel, evAll){
  const w = panel.state.lwin != null ? panel.state.lwin : 900000, f = panel.state.flt || "all", now = Date.now();
  const ev = evAll.filter(e => (!w || e.t >= now - w) && (f === "all" || (f === "abs" ? e.ev === "ABSORB" : e.side === f)));
  if (!ev.length) return '<div class="err" style="color:#848e9c">'+esc(T("watching"))+'</div>';
  const rgb = {PLACED:"74,163,255", PULLED:"240,185,11", FILLED:"132,142,156", ABSORB:"181,124,255"}, col = {PLACED:"#4aa3ff", PULLED:"#f0b90b", FILLED:"#9aa3ad", ABSORB:"#c9a3ff"};
  const note = {PLACED:T("placed"), PULLED:T("pulled"), FILLED:T("filled"), ABSORB:"absorption"};
  let h = '<table class="fx">'+colGroup(panel,"lim",LIM_COLS)+headRow([T("event"),T("side"),T("price"),T("size"),T("note"),T("time")],["","","","r","","r"]);
  ev.slice(0,60).forEach(e => { const fr = now-e.t < 6000 ? ' class="cf"' : ""; h += '<tr style="background:rgba('+rgb[e.ev]+',.08);box-shadow:inset 3px 0 0 '+col[e.ev]+'"><td'+fr+' style="color:'+col[e.ev]+';font-weight:700">'+e.ev+'</td><td class="'+(e.side==="bid"?"g":"rd")+'" style="font-weight:700">'+e.side.toUpperCase()+'</td><td'+fr+'>'+fmtP(e.p)+'</td><td class="r">'+fmtQ(e.q)+'</td><td class="m" style="font-size:10px">'+esc(note[e.ev])+'</td><td class="r m">'+hms(e.t)+'</td></tr>'; });
  return h+'</table>';
}

function logoColor(sym){ let h = 0; for (const c of sym) h = (h*31 + c.charCodeAt(0)) % 360; return "hsl("+h+",70%,60%)"; }
function alertCard(a){
  const c = a.card, bull = c.direction === "bullish", st = "★".repeat(c.score)+'<span class="o">'+"★".repeat(Math.max(0,c.max-c.score))+'</span>';
  const f = v => fmtP(v), pl = c.plan, base = c.symbol.split("-")[0];
  const d = el("div","card"); d.style.borderInlineStart = "3px solid "+(bull ? "#0ecb81" : "#f6465d");
  d.innerHTML = '<div class="row"><span class="logo" style="background:'+logoColor(base)+'">'+esc(base.slice(0,4))+'</span><b style="font-size:13px">'+esc(c.symbol)+'</b>'
    +'<span class="badge" style="background:'+(bull?"#0ecb81":"#f6465d")+';color:#000">'+esc(bull ? T("long") : T("short"))+'</span><span class="grow"></span><span class="stars" title="'+c.score+'/'+c.max+'">'+st+'</span></div>'
    +'<div class="row" style="margin-top:4px">'+(c.tags||[]).map(t => '<a class="badge" target="_blank" rel="noopener noreferrer" href="'+esc(/^https:\/\//.test(c.tv||"") ? c.tv : "#")+'" title="'+esc(t[3]||"")+'" style="text-decoration:none;cursor:help;background:'+esc(t[1])+';color:'+esc(t[2])+'">'+esc(tagTxt(t[0]))+'</a>').join("")+'<span class="m">'+c.score+' '+esc(T("strats"))+'</span><span class="grow"></span><b style="color:'+(c.score/c.max>=0.6?"#0ecb81":c.score/c.max>=0.4?"#f0b90b":"#848e9c")+'" title="'+esc(T("conf"))+'">'+Math.round(100*c.score/c.max)+'%</b></div>'
    +(pl ? '<div class="plan"><div style="color:#4aa3ff">'+esc(T("entry"))+'<br>'+f(pl.entry)+'</div><div style="color:#f6465d">'+esc(T("stop"))+'<br>'+f(pl.stop)+'</div>'+pl.tps.map((v,i) => '<div style="color:#0ecb81">TP'+(i+1)+'<br>'+f(v)+'</div>').join("")+'</div>' : "")
    +'<div class="row" style="margin-top:5px"><span class="badge" style="border:1px solid #f0b90b;color:#f0b90b">'+esc(ttTxt(c.ttype))+'</span><span class="m">'+esc(T("eta"))+': TP1 '+esc(etaTxt((c.eta||{}).tp1))+' · TP3 '+esc(etaTxt((c.eta||{}).tp3))+'</span></div>'
    +'<div class="row" style="margin-top:5px"><button class="sc">'+esc(T("showchart"))+'</button><a class="link" target="_blank" rel="noopener noreferrer" href="'+esc(/^https:\/\//.test(c.tv||"") ? c.tv : "#")+'">'+esc(T("tvopen"))+' ↗</a><span class="grow"></span><span class="m">'+hms(a.t)+'</span></div>';
  d.querySelector(".sc").onclick = () => Ws.showOnChart(c);
  return d;
}
Ws.showOnChart = c => {
  const ch = Ws.panels.find(p => p.type === "chart"); if (!ch) return;
  if (ch.state.sym !== c.symbol) Ws.broadcast(ch, c.symbol);
  ch.setOverlay({tf:c.tfc, tags:c.tags, zones:c.zones, plan:c.plan, ew:c.ew}); ch.front();
};
/* ---- video helpers ---- */
function embedUrl(u){
  let m;
  if ((m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/i))) return "https://www.youtube-nocookie.com/embed/"+m[1];
  if ((m = u.match(/youtube\.com\/playlist\?(?:.*&)?list=([\w-]+)/i))) return "https://www.youtube-nocookie.com/embed/videoseries?list="+m[1];
  if ((m = u.match(/tiktok\.com\/.*\/video\/(\d+)/i))) return "https://www.tiktok.com/embed/v2/"+m[1];
  return "";
}
function insights(text){
  if (!text.trim()) return '<div class="m">'+esc(T("none"))+'</div>';
  const low = text.toLowerCase(), names = {BTC:["btc","bitcoin","بيتكوين","البيتكوين"],ETH:["eth","ethereum","إيثريوم","ايثريوم"],SOL:["sol","solana","سولانا"],XRP:["xrp","ripple","ريبل"],BNB:["bnb","binance coin"],DOGE:["doge","dogecoin","دوج"]};
  SYMS.forEach(s => { const b = s.split("-")[0]; if (!names[b]) names[b] = [b.toLowerCase()]; });
  const coins = Object.keys(names).filter(k => names[k].some(w => new RegExp("(^|[^a-z\\u0600-\\u06FF])"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"($|[^a-z\\u0600-\\u06FF])","i").test(low)));
  const lv = [...new Set((text.match(/\$?\b\d{1,3}(?:,\d{3})+(?:\.\d+)?\b|\$?\b\d{2,6}(?:\.\d+)?\s?[kK]\b|\$\d+(?:\.\d+)?/g) || []).map(s => s.trim()))].slice(0,14);
  const bullW = ["bullish","breakout","rally","pump","support holds","buy","long","moon","صعود","صاعد","شراء","اختراق","ارتفاع"], bearW = ["bearish","breakdown","dump","crash","sell","short","resistance rejects","هبوط","هابط","بيع","كسر","انخفاض"];
  const cnt = ws => ws.reduce((a,w) => a + (low.split(w).length-1), 0), b = cnt(bullW), r = cnt(bearW);
  const sents = text.split(/(?<=[.!?؟\n])\s+/).filter(s => /(target|support|resistance|stop|entry|breakout|هدف|دعم|مقاومة|وقف|دخول|اختراق|\d)/i.test(s)).slice(0,6);
  return '<div><b>'+esc(T("coins"))+':</b> '+(coins.length ? coins.map(c => '<span class="chip">'+esc(c)+'</span>').join("") : esc(T("none")))+'</div>'
    +'<div><b>'+esc(T("levels"))+':</b> '+(lv.length ? lv.map(c => '<span class="chip">'+esc(c)+'</span>').join("") : esc(T("none")))+'</div>'
    +'<div><b>'+esc(T("tone"))+':</b> <span class="g">'+esc(T("bull"))+' '+b+'</span> / <span class="rd">'+esc(T("bear"))+' '+r+'</span></div>'
    +'<div><b>'+esc(T("claims"))+':</b><ul style="margin:2px 0;padding-inline-start:16px">'+(sents.length ? sents.map(s => '<li>'+esc(s)+'</li>').join("") : "<li>"+esc(T("none"))+"</li>")+'</ul></div>';
}

/* ---------------- workspace manager ---------------- */
Ws.el = document.getElementById("ws");
const SYMW = ["chart","dom","tape","limits"];
Ws.broadcast = (from, sym) => {
  if (SYMW.includes(from.type)) from.setSymbol(sym);
  const g = from.state.group;
  Ws.panels.forEach(p => { if (p !== from && SYMW.includes(p.type) && (g ? p.state.group === g : from.type === "watch")) p.setSymbol(sym); });
};
Ws.checkEmpty = () => { const e = document.getElementById("empty"); e.textContent = T("emptyMsg"); e.style.display = Ws.panels.length ? "none" : "flex"; };
Ws.save = () => {
  store.set(LS, { lang, v:7, panels: Ws.panels.map(p => ({type:p.type, rect: p.max && p.prev ? p.prev : p.rect, state:p.state})) });
  Ws.checkEmpty();
};
Ws.clear = () => { Ws.panels.slice().forEach(p => { p.clearSubs(); p.destroy && p.destroy(); p.root.remove(); }); Ws.panels = []; };
Ws.defaults = () => {
  const W = Ws.el.clientWidth || 1200, H0 = Ws.el.clientHeight || 700, r = v => Math.round(v/10)*10, rh = 150, oy = rh + 10, H = H0 - oy;
  const lw = r(W*0.22), x1 = lw+10, cw = r(W*0.36), x2 = x1+cw+10, dw = r(W*0.18), x3 = x2+dw+10, tw = W-x3;
  const top = r(H*0.7), wh = r(H*0.62), sh = 100;
  return [["ready", {x:0,y:0,w:W,h:rh}, {}]].concat([
    ["watch", {x:0,y:0,w:lw,h:wh}, {group:1}],
    ["alerts", {x:0,y:wh+10,w:lw,h:H-wh-10}, {}],
    ["links", {x:x1,y:0,w:cw+dw+10,h:sh-10}, {}],
    ["ticker", {x:x3,y:0,w:tw,h:sh-10}, {}],
    ["chart", {x:x1,y:sh,w:cw,h:r((top-sh)/2)}, {sym:SYMS[0], group:1, tf:"15s", ema:{9:true,21:false,50:false}}],
    ["chart", {x:x1,y:sh+r((top-sh)/2)+10,w:cw,h:top-sh-r((top-sh)/2)-10}, {sym:SYMS[0], group:1, tf:"5m", ema:{9:true,21:true,50:false}}],
    ["dom", {x:x2,y:sh,w:dw,h:top-sh}, {sym:SYMS[0], group:1}],
    ["tape", {x:x3,y:sh,w:tw,h:top-sh}, {sym:SYMS[0], group:1}],
    ["limits", {x:x1,y:top+10,w:cw+dw+10,h:H-top-10}, {sym:SYMS[0], group:1}],
    ["news", {x:x3,y:top+10,w:tw,h:H-top-10}, {}],
  ].map(([t,rc,st]) => [t, Object.assign({}, rc, {y:rc.y+oy}), st]));
};
Ws.build = list => { list.forEach(([t,r,s]) => new Panel(t, r, s)); Ws.checkEmpty(); };
Ws.cascade = 0;
Ws.add = type => {
  const o = (Ws.cascade++ % 8)*30 + 20;
  new Panel(type, {x:o,y:o,w:type==="chart"?560:340,h:type==="chart"?340:300}, {sym:SYMS[0], group:0});
  Ws.save();
};

/* toolbar */
function buildBar(){
  const bar = document.getElementById("bar"); bar.innerHTML = "";
  const sel = el("select"); sel.append(Object.assign(el("option"), {textContent:T("add"), value:""}));
  ["ready","scanner","chart","dom","tape","limits","watch","alerts","fib","news","ticker","links","video","notes"].forEach(t => sel.append(Object.assign(el("option"), {textContent:T(t), value:t})));
  sel.onchange = () => { if (sel.value) Ws.add(sel.value); sel.value = ""; };
  const bT = el("button",null,T("trading")), bB = el("button",null,T("blank"));
  bT.onclick = () => { Ws.clear(); Ws.build(Ws.defaults()); Ws.save(); }; bB.onclick = () => { Ws.clear(); Ws.save(); };
  bar.append(sel, bT, bB, el("span","sp"));
  [["smart","smart"],["big","big"],["abs","absorb"]].forEach(([lab,key]) => {
    const l = el("label",null,esc(T(lab))), i = el("input"); i.type = "number"; i.step = "0.5"; i.min = "1"; i.value = settings[key];
    i.onchange = () => { settings[key] = Math.max(1, +i.value || settings[key]); saveSettings(); }; l.append(i); bar.append(l);
  });
  const d = el("span"); d.id = "dot"; bar.append(d);
}
function applyLang(rebuild){
  document.documentElement.lang = lang; document.body.classList.toggle("rtl", lang === "ar");
  buildBar();
  if (rebuild){ const snap = Ws.panels.map(p => [p.type, p.max && p.prev ? p.prev : p.rect, p.state]); Ws.clear(); Ws.build(snap); Ws.save(); }
  Ws.checkEmpty();
}
(function init(){
  const saved = store.get(LS, null);
  lang = CFG.lang || (saved && saved.lang) || "en";
  document.documentElement.lang = lang; document.body.classList.toggle("rtl", lang === "ar"); buildBar();
  if (saved && saved.v >= 7 && Array.isArray(saved.panels)) Ws.build(saved.panels.map(p => [p.type, p.rect, p.state]));
  else Ws.build([]);   // blank canvas by default; "Trading layout" button adds the preset
  window.__ws = Ws;
})();
</script>
