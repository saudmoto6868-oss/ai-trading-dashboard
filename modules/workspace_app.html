   Potential Reversal Zone (PRZ) where D should print. PRZ = the XA-retracement level (or range) intersected with the BC projection range of the pattern; plan = entry at D / PRZ, stop beyond X
   (Gartley / Bat / Cypher) or beyond the PRZ (Butterfly / Crab), targets at 0.382 / 0.618 of the A-D leg and at A. These stop / target conventions are common practice, not a fixed standard. */
const HARM_BC = {"Gartley":[1.13,1.618], "Bat":[1.618,2.618], "Butterfly":[1.618,2.24], "Crab":[2.24,3.618]};
function harmPrz(name, X, A, B, C){
  const sg = A > X ? 1 : -1, xa = Math.abs(A-X), r = HARM_RULES[name];
  if (name === "Cypher"){ const xc = Math.abs(C-X), l = C - sg*r.d[0]*xc; return {lo:Math.min(l, l), hi:Math.max(l, l), mid:l, pad:.03*xa}; }
  let l1 = A - sg*r.d[0]*xa, l2 = A - sg*r.d[1]*xa; if (r.d[0] === r.d[1]){ l1 += .03*xa*sg; l2 -= .03*xa*sg; }   // single ratio -> +-3% of XA band
  let lo = Math.min(l1, l2), hi = Math.max(l1, l2); const bc = HARM_BC[name];
  if (bc){ const q1 = C - sg*bc[0]*Math.abs(C-B), q2 = C - sg*bc[1]*Math.abs(C-B), plo = Math.min(q1, q2), phi = Math.max(q1, q2), olo = Math.max(lo, plo), ohi = Math.min(hi, phi); if (olo <= ohi){ lo = olo; hi = ohi; } }
  return {lo, hi, mid:(lo+hi)/2, pad:0};
}
function harmPlan(name, X, A, C, D, prz){   // D = price where the trade is taken (D pivot, or the PRZ mid for a forming pattern)
  const sg = A > X ? 1 : -1, xa = Math.abs(A-X), far = sg > 0 ? Math.min(D, prz.lo) : Math.max(D, prz.hi);
  const stop = (name === "Butterfly" || name === "Crab") ? far - sg*0.1*xa : X - sg*0.02*xa, ad = Math.abs(A-D);

function harmFind(d, maxN){   // newest-first list of {name, dir, state:"done"|"forming", pts:[{i,p}] (5 for done, 4 for forming), prz, plan}
  const z = harmZigzag(d, 0.012, 3), res = [], n = d.length; if (z.length < 4 || !n) return res; const last = d[n-1].c;

    const w = z.slice(e-5, e), nm = harmCheck(w[0].p, w[1].p, w[2].p, w[3].p, w[4].p); if (!nm || n-1 - w[4].i > 150) continue;
    const prz = harmPrz(nm, w[0].p, w[1].p, w[2].p, w[3].p);
    res.push({name:nm, dir:w[1].p > w[0].p ? "bull" : "bear", state:"done", pts:w.map(q => ({i:q.i, p:q.p})), prz, plan:harmPlan(nm, w[0].p, w[1].p, w[3].p, w[4].p, prz)});
  }
  const w = z.slice(-4), X = w[0].p, A = w[1].p, B = w[2].p, C = w[3].p, sg = A > X ? 1 : -1;   // forming: X-A-B-C confirmed, price heading for D
  if (sg*(B-X) > 0 && sg*(A-B) > 0 && sg*(A-C) > 0 && sg*(C-B) > 0 && n-1 - w[3].i <= 60){
    const xa = Math.abs(A-X), ab = Math.abs(A-B), b = ab/xa, cab = Math.abs(C-B)/ab;
    for (const [nm, r] of Object.entries(HARM_RULES)){

      const prz = harmPrz(nm, X, A, B, C), tgtSide = sg > 0 ? last >= prz.lo - .1*xa : last <= prz.hi + .1*xa;   // price has not blown through the zone
      if (tgtSide && (sg > 0 ? last < C : last > C)){ res.unshift({name:nm, dir:sg > 0 ? "bull" : "bear", state:"forming", pts:w.map(q => ({i:q.i, p:q.p})), prz, plan:harmPlan(nm, X, A, C, prz.mid, prz)}); break; }

/* Volume profile: rows [{h,l,v}] -> POC / value area (70%) / bins. Volume of each candle is spread across the price bins it touched. */
function vpCalc(rows, nb){
  nb = nb || 60; if (!rows.length) return null; const hasD = rows.some(r => r.d != null);
  let lo = Infinity, hi = -Infinity; rows.forEach(r => { if (r.l < lo) lo = r.l; if (r.h > hi) hi = r.h; });
  if (!(hi > lo)) return null; const st = (hi-lo)/nb, bins = new Array(nb).fill(0), dl = new Array(nb).fill(0);
  rows.forEach(r => { const a = Math.min(nb-1, Math.max(0, Math.floor((r.l-lo)/st))), b = Math.min(nb-1, Math.max(0, Math.floor((r.h-lo)/st))), v = (r.v || 0) / (b-a+1), dd = (r.d || 0) / (b-a+1); for (let i = a; i <= b; i++){ bins[i] += v; dl[i] += dd; } });
  let pi = 0; bins.forEach((v,i) => { if (v > bins[pi]) pi = i; });

  return {poc:mid(pi), vah:lo+(b+1)*st, val:lo+a*st, lo, hi, st, bins, dl, hasD, max:bins[pi]};
}

      {id:"kzs", label:Lg("Kill Zone Sniper (JOAT style)","Kill Zone Sniper (ستايل JOAT)"), tip:Lg("Sweep-and-reverse inside the London (02-05) / NY AM (07-10) kill zones, New York time: a candle takes the 20-bar low (high), closes back with a body >= 0.9 ATR (and >= 1.5x average volume when the feed has volume). Draws the swept pool, a sniper mark, and the projected entry / stop (sweep wick) / target (30-bar swing, >= 1.5R) as a green/red box, plus a small table counting what is drawn. Same rules as the scanner's Kill Zone Sniper detector. 1H and lower. Idea from the open-source 'ICT Kill Zone Sniper [JOAT]' description; not a copy of its code.","سحب سيولة وانعكاس جوه كيل زون لندن (02-05) / نيويورك الصبح (07-10) بتوقيت نيويورك: شمعة تكسر أقل قاع لآخر 20 شمعة (أو أعلى قمة) وتقفل راجعة بجسم >= 0.9 ATR (و>= 1.5 ضعف متوسط الفوليوم لو فيه فوليوم). بيرسم المستوى المسحوب، علامة القناص، وصندوق الدخول / الوقف (طرف الذيل) / الهدف (قمة/قاع آخر 30 شمعة، >= 1.5R)، وجدول صغير بعدد اللي اترسم. نفس قواعد كاشف Kill Zone Sniper في السكانر. فريم ساعة وأقل. الفكرة من وصف مؤشر JOAT المفتوح، مش نسخة من الكود."), get:() => ch().kzsOn, set:v => { ch().kzsOn = v; this.state.kzs = v; }},

Ws.mshow = p => { if (!MOB || !p) return; Ws.panels.forEach(q => q.root.classList.toggle("mact", q === p)); Ws.mcur = p; p.min = false; p.root.classList.remove("min");
  const mm = document.getElementById("mmore"); if (mm) mm.classList.remove("on");
  document.querySelectorAll("#mnav button").forEach(b => b.classList.toggle("on", !!b._match && b._match(p))); setTimeout(() => { try { p.chart && (p.chart.resize ? p.chart.resize() : 0, p.chart.draw()); } catch(e){} }, 30); };
Ws.mjump = () => {
  if (!MT5){ ["mnav","mmore"].forEach(id => { const x = document.getElementById(id); if (x) x.remove(); }); Ws.panels.forEach(q => q.root.classList.remove("mact")); return; }
  let j = document.getElementById("mnav"); if (!j){ j = el("div"); j.id = "mnav"; document.body.append(j); }
  let mm = document.getElementById("mmore"); if (!mm){ mm = el("div"); mm.id = "mmore"; document.body.append(mm); }
  j.innerHTML = ""; const used = new Set();
  MTABS.forEach(([lab, kinds, make]) => { const b = el("button", null, Lg(lab[0], lab[1])); const pick = () => kinds.map(k => Ws.panels.find(p => p.type === k && !used.has(p))).find(Boolean);
    const p0 = pick(); if (p0) used.add(p0); b._match = p => p === p0 || (!p0 && kinds.includes(p.type));
    b.onclick = () => { let p = p0 && Ws.panels.includes(p0) ? p0 : null; if (!p){ Ws.add(make); p = Ws.panels[Ws.panels.length - 1]; } Ws.mshow(p); }; j.append(b); });
  const rest = Ws.panels.filter(p => !used.has(p)), more = el("button", null, Lg("More","المزيد"));
  more._match = p => rest.includes(p); more.onclick = () => { mm.innerHTML = ""; rest.forEach(p => { const x = el("button", null, T(p.type)); x.onclick = () => Ws.mshow(p); mm.append(x); });
    const add = el("button", null, "+ "+Lg("Add widget","إضافة ويدجت")); add.onclick = () => { mm.classList.remove("on"); const sel = document.querySelector("#bar select"); sel && sel.focus(); }; mm.append(add); mm.classList.toggle("on"); };
  j.append(more);
  if (!Ws.mcur || !Ws.panels.includes(Ws.mcur)) Ws.mshow(Ws.panels.find(p => p.type === "chart") || Ws.panels[0]); else Ws.mshow(Ws.mcur); };
Ws.checkEmpty = () => { Ws.mjump && Ws.mjump(); const e = document.getElementById("empty"); e.textContent = T("emptyMsg"); e.style.display = Ws.panels.length ? "none" : "flex"; };
Ws.save = () => {
  store.set(LS, { lang, v:7, panels: Ws.panels.map(p => ({type:p.type, rect: p.max && p.prev ? p.prev : p.rect, state:p.state})) });
  Ws.checkEmpty(); Ws.histPush();
};
/* Undo / Redo: every saved change of the workspace (panels added / removed / moved / resized, symbols, timeframes, indicators, colours, per-panel settings) is a step; the last 120 steps are kept */
Ws.hist = {a:[], i:-1, max:121, mute:0};
Ws.histPush = () => { const H = Ws.hist; if (H.mute) return; let snap; try { snap = JSON.stringify(Ws.panels.map(p => [p.type, p.max && p.prev ? p.prev : p.rect, p.state])); } catch(e){ return; }
  if (H.a[H.i] === snap) return; const now = Date.now(); if (H.i > 0 && H.i === H.a.length-1 && now - (H.t || 0) < 400){ H.a[H.i] = snap; H.t = now; Ws.histUI(); return; }   // saves fired back-to-back by one action count as one step
  H.t = now; H.a = H.a.slice(0, H.i+1); H.a.push(snap); if (H.a.length > H.max) H.a.shift(); H.i = H.a.length-1; Ws.histUI(); };
Ws.histGo = d => { const H = Ws.hist, j = H.i + d; if (j < 0 || j >= H.a.length) return; H.i = j; H.mute++;
  try { const list = JSON.parse(H.a[j]); Ws.clear(); Ws.build(list); Ws.save(); } finally { H.mute--; } Ws.histUI(); };
Ws.undo = () => Ws.histGo(-1); Ws.redo = () => Ws.histGo(1);
Ws.histUI = () => { const H = Ws.hist, u = document.getElementById("undoB"), r = document.getElementById("redoB"); if (u){ u.disabled = H.i <= 0; u.title = (lang === "ar" ? "تراجع (Ctrl+Z) — " : "Undo (Ctrl+Z) — ")+Math.max(0, H.i)+(lang === "ar" ? " خطوة متاحة" : " steps available"); }
  if (r){ r.disabled = H.i >= H.a.length-1; r.title = (lang === "ar" ? "إعادة (Ctrl+Shift+Z / Ctrl+Y) — " : "Redo (Ctrl+Shift+Z / Ctrl+Y) — ")+Math.max(0, H.a.length-1-H.i)+(lang === "ar" ? " خطوة" : " steps"); } };
document.addEventListener("keydown", e => { if (!(e.ctrlKey || e.metaKey) || e.altKey) return; const t = e.target, tn = t && t.tagName; if (tn === "INPUT" || tn === "TEXTAREA" || tn === "SELECT" || (t && t.isContentEditable)) return;
  const k = e.key.toLowerCase(); if (k === "z" && !e.shiftKey){ e.preventDefault(); Ws.undo(); } else if ((k === "z" && e.shiftKey) || k === "y"){ e.preventDefault(); Ws.redo(); } });
Ws.clear = () => { Ws.panels.slice().forEach(p => { p.clearSubs(); p.destroy && p.destroy(); p.root.remove(); }); Ws.panels = []; };
Ws.defaults = () => {
  const W = Ws.el.clientWidth || 1200, H0 = Ws.el.clientHeight || 700, r = v => Math.round(v/10)*10, rh = 150, oy = rh + 10, H = H0 - oy;
  const lw = r(W*0.22), x1 = lw+10, cw = r(W*0.36), x2 = x1+cw+10, dw = r(W*0.18), x3 = x2+dw+10, tw = W-x3;
  const top = r(H*0.7), wh = r(H*0.62), sh = 0;
  return [["signals", {x:0,y:0,w:W,h:rh}, {}]].concat([
    ["watch", {x:0,y:0,w:lw,h:wh}, {group:1}],
    ["alerts", {x:0,y:wh+10,w:lw,h:H-wh-10}, {}],
    ["chart", {x:x1,y:sh,w:cw,h:r((top-sh)/2)}, {sym:SYMS[0], group:1, tf:"15s", ema:{9:true,21:false,50:false}}],
    ["chart", {x:x1,y:sh+r((top-sh)/2)+10,w:cw,h:top-sh-r((top-sh)/2)-10}, {sym:SYMS[0], group:1, tf:"5m", ema:{9:true,21:true,50:false}}],
    ["dom", {x:x2,y:sh,w:dw,h:top-sh}, {sym:SYMS[0], group:1}],
    ["tape", {x:x3,y:sh,w:tw,h:top-sh}, {sym:SYMS[0], group:1}],
    ["limits", {x:x1,y:top+10,w:cw,h:H-top-10}, {sym:SYMS[0], group:1}],
    ["scanner", {x:x2,y:top+10,w:dw+10+tw,h:H-top-10}, {}],
  ].map(([t,rc,st]) => [t, Object.assign({}, rc, {y:rc.y+oy}), st]));
};
const RETIRED = {ready:"signals", ticker:null, links:null, video:null};   // owner OK 2026-10-17: duplicates / not part of the trading decision
Ws.build = list => { Ws.hist.mute++; try { list.map(([t,r,s]) => [t in RETIRED ? RETIRED[t] : t, r, s]).filter(([t]) => t).forEach(([t,r,s]) => new Panel(t, r, s)); } finally { Ws.hist.mute--; } Ws.checkEmpty(); };
Ws.cascade = 0;
Ws.add = type => {
  const o = (Ws.cascade++ % 8)*30 + 20;
  new Panel(type, {x:o,y:o,w:type==="chart"?560:340,h:type==="chart"?340:300}, {sym:SYMS[0], group:0});
  Ws.save();
};

/* toolbar */
function buildBar(){
  const bar = document.getElementById("bar"); bar.innerHTML = "";
  const sel = el("select"); sel.append(Object.assign(el("option"), {textContent:T("add"), value:""}));
  [[Lg("Decision","القرار"), ["chart","setup","signals","alerts"]], [Lg("Execution / order flow","التنفيذ والأوردر فلو"), ["dom","tape","limits","risk"]], [Lg("Markets","الأسواق"), ["tvc","scanner","watch","valuelv","rsihm","fundhm","posn","liq","web"]], [Lg("Context (fundamental)","السياق (الأساسي)"), ["fund","macrof","stockf","cmc","news"]], [Lg("Review","المراجعة"), ["journal","notes"]], [Lg("Settings","الإعدادات"), ["settings"]]]
    .forEach(([g, ts]) => { const og_ = Object.assign(el("optgroup"), {label:g}); ts.forEach(t => og_.append(Object.assign(el("option"), {textContent:T(t), value:t}))); sel.append(og_); });
  const og = Object.assign(el("optgroup"), {label: lang === "ar" ? "التخطيط" : "Layout"}); [["@trading",T("trading")],["@blank",T("blank")]].forEach(([v,t]) => og.append(Object.assign(el("option"), {textContent:t, value:v}))); sel.append(og);
  sel.onchange = () => { const v = sel.value; if (v === "@trading"){ Ws.clear(); Ws.build(Ws.defaults()); Ws.save(); } else if (v === "@blank"){ Ws.clear(); Ws.save(); } else if (v) Ws.add(v); sel.value = ""; };
  const ub = el("button", null, "↶"), rb = el("button", null, "↷"); ub.id = "undoB"; rb.id = "redoB"; ub.onclick = () => Ws.undo(); rb.onclick = () => Ws.redo(); ub.style.cssText = rb.style.cssText = "padding:2px 8px;font-size:14px";
  const zKey = LS+"_us_"+(CFG.ui || "classic"), zDef = {lux:1.06, hud:1.04}[CFG.ui] || 1, zSet = v => { v = Math.max(.8, Math.min(1.4, Math.round(v*100)/100)); document.documentElement.style.setProperty("--us", v); store.set(zKey, v); zLbl.textContent = Math.round(v*100)+"%"; setTimeout(() => { try { Ws.panels.forEach(p => p.chart && (p.chart.resize ? p.chart.resize() : 0, p.chart.draw())); } catch(e){} }, 320); };
  const zm = el("button", null, "−"), zp = el("button", null, "+"), zLbl = el("span"); zm.title = Lg("Smaller interface","تصغير الواجهة"); zp.title = Lg("Bigger interface","تكبير الواجهة"); zLbl.style.cssText = "color:var(--mut);min-width:34px;text-align:center;cursor:pointer"; zLbl.title = Lg("Back to the theme's size","رجوع لحجم الثيم");
  zm.onclick = () => zSet((+store.get(zKey, zDef)) - .05); zp.onclick = () => zSet((+store.get(zKey, zDef)) + .05); zLbl.onclick = () => zSet(zDef);
if (!MOB){ bar.append(sel, ub, rb, zm, zLbl, zp, el("span","sp")); }
  else {   // phones: a settings button keeps the bar short - the MT5 layout switch and the interface size live under it
    const gear = el("button", null, "⚙"), menu = el("div"); menu.id = "mset"; gear.title = Lg("Settings","الإعدادات");
    const mt = el("button"), mtLbl = () => { mt.textContent = (MT5 ? "✓ " : "○ ")+Lg("MetaTrader layout","واجهة ميتاتريدر"); };
    mt.onclick = () => { MT5 = !MT5; store.set(LS+"_mt5", MT5); document.body.classList.toggle("mt5", MT5); mtLbl(); menu.classList.remove("on");   // switch live, no reload
      Ws.panels.forEach(p => p.apply()); Ws.mjump(); if (!MT5 && Ws.panels[0]) Ws.el.scrollTop = 0;
      setTimeout(() => Ws.panels.forEach(p => { try { p.chart && (p.chart.resize ? p.chart.resize() : 0, p.chart.draw()); } catch(_){} }), 60); };
    mtLbl();
    const zr = el("div"); zr.style.cssText = "display:flex;align-items:center;gap:6px;padding:8px 12px"; zr.append(el("span", null, Lg("Size","الحجم")), zm, zLbl, zp);
    menu.append(mt, zr); gear.onclick = e => { e.stopPropagation(); menu.classList.toggle("on"); }; document.addEventListener("click", e => { if (!menu.contains(e.target)) menu.classList.remove("on"); });
    bar.append(sel, ub, rb, el("span","sp"), gear); document.body.append(menu); }
  zSet(+store.get(zKey, zDef)); Ws.histUI();
  const d = el("span"); d.id = "dot"; bar.append(d);
}
function applyLang(rebuild){
  document.documentElement.lang = lang; document.body.classList.toggle("rtl", lang === "ar");
  buildBar();
  if (rebuild){ const snap = Ws.panels.map(p => [p.type, p.max && p.prev ? p.prev : p.rect, p.state]); Ws.clear(); Ws.build(snap); Ws.save(); }
  Ws.checkEmpty();
}
(function init(){
  const saved = store.get(LS, null);
  lang = CFG.lang || (saved && saved.lang) || "en";
  document.documentElement.lang = lang; document.body.classList.toggle("rtl", lang === "ar"); document.body.classList.toggle("mob", MOB); document.body.classList.toggle("mt5", MT5); buildBar();
  if (MOB) document.addEventListener("click", e => { const b = e.target.closest(".dt > :first-child"); if (b) b.parentElement.classList.toggle("open"); }, true);
  if (saved && saved.v >= 7 && Array.isArray(saved.panels)) Ws.build(saved.panels.map(p => [p.type, p.rect, p.state]));
  else if (MOB){ const keep = ["chart","setup","signals","watch","alerts","tape"]; Ws.build(Ws.defaults().filter(([t, , st]) => keep.includes(t) && !(t === "chart" && st.tf === "15s")).sort((a, b) => keep.indexOf(a[0]) - keep.indexOf(b[0]))); Ws.save(); }   // phone, first visit: a short stacked set instead of an empty screen
  else Ws.build([]);   // blank canvas by default; "Trading layout" button adds the preset
  window.__ws = Ws; Ws.histPush(); setTimeout(() => { try { localStorage.removeItem(LS + "_boot"); } catch(e){} }, 5000);   // a freeze while drawing blocks this timer, so the flag stays
  if (window.__wsSafeBoot){ const n = document.createElement("div"); n.style.cssText = "position:fixed;left:50%;top:44px;transform:translateX(-50%);z-index:9999;background:#2b2410;color:#f0b90b;border:1px solid #f0b90b;border-radius:6px;padding:6px 12px;font:12px sans-serif";
    n.textContent = Lg("The Workspace did not load last time, so its saved layout was reset (journal kept). Add widgets with + Widget.", "الورك سبيس ما فتحش آخر مرة، فاتعمل reset للترتيب المحفوظ (الجورنال محفوظ). ضيف الويدجتات من + Widget.");
    document.body.appendChild(n); setTimeout(() => n.remove(), 12000); }
})();
</script>
