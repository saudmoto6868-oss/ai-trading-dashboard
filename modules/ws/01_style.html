html,body{overscroll-behavior:none}   /* a pull at the top / bottom of the widget never chains to the page = no pull-to-refresh that reloads everything (tablets / phones) */
body.tab canvas{touch-action:none}   /* tablets: the chart itself handles one finger = move, two fingers = zoom (horizontal spread = time, vertical spread = price), drag on the price axis = price scale; the browser must not scroll / zoom the page under the finger */
body.tch .rz{width:30px;height:30px}body.tch .rz-s{height:14px}body.tch .rz-n{height:10px}body.tch .rzh{min-width:12px}   /* finger-sized resize handles on touch screens */

/* ---- dashboard theme 1 "Less is More": blurred photo behind everything, rounded glass cards, amber glow ---- */
body.ui-lux{background:#0d0c0a var(--uibg) center/cover fixed no-repeat}

/* ---- motion (dashboard themes): widgets glide when they move / resize / maximise (not while dragged), open with the theme's own entrance ---- */
body.ui-lux .panel,body.ui-hud .panel{transition:left .28s cubic-bezier(.2,.8,.2,1),top .28s cubic-bezier(.2,.8,.2,1),width .28s cubic-bezier(.2,.8,.2,1),height .28s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s,transform .25s}
body .panel.drag{transition:none!important}
body.ui-lux .panel.focus{background:rgba(20,18,15,.94)} body.ui-hud .panel.focus{background:rgba(10,15,20,.92)}   /* the widget in front is solid: nothing shows through a maximised one */
body.ui-lux .panel{animation:luxIn .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes luxIn{from{opacity:0;transform:scale(.96) translateY(8px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
body.ui-lux .panel:hover{box-shadow:0 16px 40px rgba(0,0,0,.55),0 0 22px rgba(224,169,90,.10)}
body.ui-lux #ws::after{content:"";position:fixed;inset:0;pointer-events:none;background:#000;animation:luxFade .9s ease-out forwards;z-index:50}
@keyframes luxFade{from{opacity:1}to{opacity:0}}
body.ui-hud .panel{animation:hudIn .45s steps(1,end) both,hudWipe .5s cubic-bezier(.3,.9,.3,1) both}
@keyframes hudIn{0%{opacity:0}30%{opacity:.6}45%{opacity:.2}60%{opacity:1}100%{opacity:1}}
@keyframes hudWipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
body.ui-hud .panel:hover{border-color:rgba(240,164,60,.6)}
body.ui-hud .panel::before{content:"";position:absolute;inset:-1px;pointer-events:none;background:linear-gradient(#f0a43c,#f0a43c) top left/10px 2px,linear-gradient(#f0a43c,#f0a43c) top left/2px 10px,linear-gradient(#f0a43c,#f0a43c) bottom right/10px 2px,linear-gradient(#f0a43c,#f0a43c) bottom right/2px 10px;background-repeat:no-repeat;opacity:.0;transition:opacity .2s}
body.ui-hud .panel:hover::before,body.ui-hud .panel.focus::before{opacity:.9}
body.ui-hud #ws::after{content:"";position:fixed;left:0;right:0;height:2px;top:0;pointer-events:none;background:linear-gradient(90deg,transparent,#f0a43c,transparent);box-shadow:0 0 18px #f0a43c;animation:hudScan 1.1s ease-in forwards;z-index:50}
@keyframes hudScan{from{top:0;opacity:1}to{top:100%;opacity:0}}

body.mob.mt5 .p-chart .tb,body.mob.mt5 .p-chart .mtf,body.mob.mt5 .p-chart .dt{display:none!important}
body.mob.mt5 .panel.mact{position:fixed!important;left:0!important;right:0!important;width:100%!important;top:calc(var(--vt) + 48px)!important;height:calc(var(--vb) - var(--vt) - 104px)!important;z-index:5;border:0!important;background:#000}
body.mob.mt5{background:#000}
#m5,#m5nav,#m5ctop,#m5rad,#m5sheet,#m5drw,.m5toast{font-family:Roboto,"Segoe UI",-apple-system,sans-serif;color:#fff}
#m5{position:fixed;left:0;right:0;top:var(--vt);height:calc(var(--vb) - var(--vt) - 56px);overflow:auto;background:#000;z-index:55;-webkit-overflow-scrolling:touch}
#m5nav{position:fixed;left:0;right:0;top:calc(var(--vb) - 56px);height:56px;display:flex;background:#1c1c1e;border-top:1px solid #2c2c2e;z-index:60}
#m5nav button{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;border-radius:0;background:transparent;color:#8e8e93;padding:0;font-size:10.5px;min-height:0}
#m5nav button.on{color:#2f7df6}
.m5top,#m5ctop{display:flex;align-items:center;height:48px;background:#1c1c1e;padding:0 2px;position:sticky;top:0;z-index:2}
#m5ctop{position:fixed;left:0;right:0;top:var(--vt);z-index:60}
.m5top b,.m5pt{font-weight:500;font-size:18px;margin-inline-start:6px}.m5top .sp,#m5ctop .sp{flex:1}
.m5ib{width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;border:0!important;background:transparent!important;color:#fff;padding:0;border-radius:50%}.m5ib.on{color:#2f7df6}
.m5tf{border:0!important;background:transparent!important;color:#fff;font:500 15px Roboto,sans-serif;padding:0 8px;height:42px}
.m5cap{position:fixed;left:10px;top:calc(var(--vt) + 70px);pointer-events:none;font-size:12px;color:#e5e5ea;text-shadow:0 1px 2px #000}
.m5list{padding-bottom:10px}
.m5row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:8px 12px;border-bottom:1px solid #1f1f22}
.m5row.m5tr{grid-template-columns:1fr auto}
.m5l b{font-weight:600;font-size:15px;display:block}.m5l small,.m5p small{display:block;color:#8e8e93;font-size:11px;margin-top:2px}.m5l i{font-style:normal}
.m5p{text-align:end;min-width:92px}.m5p>span{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}.m5p big,.m5bq big{font-size:22px;font-weight:600}.m5p sup,.m5bq sup{font-size:11px}
#m5 .up,#m5sheet .up,.m5ord .up{color:#2f7df6}#m5 .dn,#m5sheet .dn,.m5ord .dn{color:#ef5350}
.m5pr{font-size:16px;font-weight:600}
.m5acc{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid #1f1f22}.m5acc div{flex:1}.m5acc span{display:block;color:#8e8e93;font-size:11px}.m5acc b{font-size:16px;font-weight:600}
.m5sec{padding:10px 12px 4px;color:#8e8e93;font-size:12px}.m5empty{padding:30px 12px;color:#8e8e93;text-align:center}.m5warn{margin:8px 12px;padding:6px 8px;border-radius:6px;background:#2a2410;color:#f0b90b;font-size:12px}
.m5msg{padding:10px 12px;border-bottom:1px solid #1f1f22}.m5msg small{color:#8e8e93;margin-inline-start:8px;font-size:11px}.m5msg p{margin:4px 0 0;font-size:13px;color:#d1d1d6}
#m5rad{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.25)}
.m5rc{position:fixed;width:0;height:0}.m5rc::before{content:"";position:absolute;left:-124px;top:-124px;width:248px;height:248px;border-radius:50%;background:rgba(28,28,30,.94);box-shadow:0 10px 40px #000c;border:1px solid #3a3a3c;animation:m5pop .18s ease-out}
.m5rt{position:absolute;left:-23px;top:-16px;width:46px;height:32px;padding:0;border-radius:16px!important;border:0!important;background:#2c2c2e!important;color:#fff;font:600 12.5px Roboto,sans-serif}.m5rt.on{background:#2f7df6!important}
.m5ri{position:absolute;left:-21px;top:-21px;width:42px;height:42px;padding:0;border-radius:50%!important;border:0!important;background:#3a3a3c!important;color:#fff;display:flex;align-items:center;justify-content:center}
.m5rx{position:absolute;left:-18px;top:-18px;width:36px;height:36px;padding:0;border-radius:50%!important;border:0!important;background:#48484a!important;color:#fff;display:flex;align-items:center;justify-content:center}
@keyframes m5pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
#m5sheet{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45)}
.m5sh{position:absolute;left:8px;right:8px;bottom:calc(100vh - var(--vb) + 8px);max-height:calc(var(--vb) - var(--vt) - 40px);overflow:auto;display:flex;flex-direction:column;gap:1px;border-radius:12px;animation:m5up .2s ease-out}
.m5shh{background:#2c2c2e;color:#8e8e93;text-align:center;padding:10px;font-size:13px;border-radius:12px 12px 0 0}
.m5si{background:#2c2c2e!important;border:0!important;border-radius:0!important;color:#2f7df6;font-size:17px;padding:13px;min-height:0}.m5si.ro{color:#e5e5ea;font-size:14px}.m5cancel{margin-top:8px;border-radius:12px!important;font-weight:600}
@keyframes m5up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.m5ord{position:absolute;left:0;right:0;top:var(--vt);height:calc(var(--vb) - var(--vt));background:#000;overflow:auto}
.m5ot{text-align:center;color:#8e8e93;padding:8px;font-size:13px}
.m5vol{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px}.m5vol button{border:0;background:transparent;color:#2f7df6;font-size:14px;padding:6px}.m5vol b{font-size:22px;min-width:80px;text-align:center}
.m5bq{display:flex;justify-content:space-around;padding:12px 0}.m5bq span{font-size:16px}
.m5ord label{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #1f1f22;color:#8e8e93}.m5ord input{width:45%;background:#1c1c1e;border:1px solid #2c2c2e;color:#fff;text-align:end;padding:6px}
.m5ob{display:flex;gap:10px;padding:14px}.m5ob button{flex:1;border:0;color:#fff;font-weight:600;padding:14px 4px;border-radius:6px}.m5ob .sell{background:#ef5350}.m5ob .buy{background:#2f7df6}
.m5note{color:#8e8e93;font-size:12px;padding:0 14px 20px;line-height:1.5}
#m5drw{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5)}
.m5dp{position:absolute;left:0;top:var(--vt);height:calc(var(--vb) - var(--vt));width:78%;max-width:320px;background:#1c1c1e;overflow:auto;animation:m5in .2s ease-out}
.m5dh{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:18px 14px;border-bottom:1px solid #2c2c2e}.m5dh svg{width:30px;height:30px}.m5dh b{font-size:18px}.m5dh small{flex-basis:100%;color:#8e8e93}
.m5dp button{display:block;width:100%;text-align:start;border:0;border-radius:0;background:transparent;color:#fff;padding:14px 16px;font-size:15px;border-bottom:1px solid #26262a}
@keyframes m5in{from{transform:translateX(-100%)}to{transform:none}}
.m5toast{position:fixed;left:50%;top:calc(var(--vb) - 130px);transform:translateX(-50%);z-index:90;background:#2c2c2e;padding:10px 14px;border-radius:20px;font-size:13px;max-width:86%;text-align:center;box-shadow:0 6px 20px #000a}
body.rtl .m5row,body.rtl .m5top{direction:rtl}
/* materials (top-bar picker / theme default): texture on panel chrome, bars, buttons - charts stay clean */
body.mat-steel .panel,body.mat-steel #bar,body.mat-steel .ph,body.mat-steel button,body.mat-steel select,body.mat-steel .g-bub,body.mat-steel #strip{background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,rgba(0,0,0,.035) 1px 3px),linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.18))}
body.mat-paper .panel,body.mat-paper #bar,body.mat-paper .ph,body.mat-paper button,body.mat-paper select,body.mat-paper .g-bub,body.mat-paper #strip{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),linear-gradient(180deg,rgba(255,250,235,.05),rgba(120,100,60,.05))}
body.mat-wood .panel,body.mat-wood #bar,body.mat-wood .ph,body.mat-wood button,body.mat-wood select,body.mat-wood .g-bub,body.mat-wood #strip{background-image:repeating-linear-gradient(92deg,rgba(120,72,30,.10) 0 2px,rgba(60,32,10,.06) 2px 7px,rgba(150,95,45,.08) 7px 9px,rgba(0,0,0,0) 9px 14px),linear-gradient(180deg,rgba(150,95,40,.10),rgba(40,20,5,.18))}
body.mat-fabric .panel,body.mat-fabric #bar,body.mat-fabric .ph,body.mat-fabric button,body.mat-fabric select,body.mat-fabric .g-bub,body.mat-fabric #strip{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 1px,transparent 1px 4px),repeating-linear-gradient(-45deg,rgba(0,0,0,.08) 0 1px,transparent 1px 4px)}
body.mat-glass .panel,body.mat-glass #bar,body.mat-glass .ph,body.mat-glass button,body.mat-glass select,body.mat-glass .g-bub,body.mat-glass #strip{background-image:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.01) 40%,rgba(255,255,255,.05))}
body.mat-carbon .panel,body.mat-carbon #bar,body.mat-carbon .ph,body.mat-carbon button,body.mat-carbon select,body.mat-carbon .g-bub,body.mat-carbon #strip{background-image:radial-gradient(rgba(255,255,255,.05) 15%,transparent 16%) 0 0/6px 6px,radial-gradient(rgba(0,0,0,.35) 15%,transparent 16%) 3px 3px/6px 6px,linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.2))}
body.mat-steel .ph,body.mat-steel #bar{box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(0,0,0,.4)}
body.mat-steel .panel{border-color:#5b6068}
body.mat-wood .panel{border-color:#6b4423;box-shadow:0 6px 18px rgba(30,15,5,.55)}body.mat-wood .ph{box-shadow:inset 0 -1px 0 rgba(0,0,0,.35)}
body.mat-paper .panel{box-shadow:0 1px 1px rgba(0,0,0,.15),0 8px 20px rgba(0,0,0,.25)}
body.mat-fabric .panel{border-style:dashed;border-color:rgba(255,255,255,.18)}
body.mat-glass .panel{background-color:color-mix(in srgb,var(--panel) 72%,transparent);backdrop-filter:blur(12px) saturate(1.3);border-color:rgba(255,255,255,.18)}
body.mat-carbon .panel{border-color:#2c2f34}body.mat-carbon .ph{box-shadow:inset 0 -1px 0 rgba(240,185,11,.25)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
