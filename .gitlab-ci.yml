# Telegram alerts on GitLab (port of .github/workflows/telegram-alerts.yml).
# Runs ONLY from a pipeline schedule or the "Run pipeline" button, never on push (saves free CI minutes).
# Needed once, in the GitLab UI (nothing secret is in this file):
#   Settings > CI/CD > Variables: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID  (Masked, Protected)
#   Build > Pipeline schedules > New schedule, branch main (the interval GitLab.com allows may be longer than 30 minutes: check)
# State files (.tg_sent.json, .brain_*.json*, ...) are kept in the job cache. A cache miss means the dedupe memory is lost and
# some alerts can repeat once; this is best effort, not a guarantee.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

default:
  image: python:3.12-slim
  interruptible: false

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

telegram_alerts:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  timeout: 15m
  resource_group: telegram-alerts        # one run at a time
  cache:
    - key: pip-312
      paths:
        - .cache/pip
    - key: tg-state
      paths:
        - .tg_sent.json
        - .tc_sent.json
        - .brain_sent.json
        - .brain_log.jsonl
        - .brain_graded.json
        - .brain_agents.jsonl
        - .signal_log.jsonl
      when: always
  before_script:
    - pip install --quiet pandas numpy requests tzdata
  script:
    - python -m modules.tg_cron || true
    - python -m modules.tclass_cron || true
    - python -m modules.brain_cron
    - python -m modules.signal_log || true
  artifacts:
    when: always
    paths:
      - .signal_log.jsonl
    expire_in: 90 days
    exclude:
      - .cache/**/*


# Isolated browser contract test. Manual "Run pipeline" runs this job only;
# Telegram / Brain jobs remain schedule-only and cannot send side-effecting alerts.
xpix_evidence_contract:
  stage: test
  image: mcr.microsoft.com/playwright:v1.56.1-noble
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
  timeout: 10m
  script:
    - npm install --no-save playwright@1.56.1
    - python3 scripts/build_workspace.py
    - node tests/browser/xpix_evidence_contract_mock.js modules/workspace_app.html
