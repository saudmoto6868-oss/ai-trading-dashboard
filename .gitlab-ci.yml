# CI entry points: run TIA quality checks on pushes and merge requests.
# Telegram jobs remain restricted to schedules and manual runs.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

default:
  image: python:3.12-slim
  interruptible: false

stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

tia_quality:
  stage: test
  timeout: 15m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
  cache:
    key: "pip-312"
    paths:
      - .cache/pip
  before_script:
    - python -m pip install --quiet --upgrade pip
    - python -m pip install --quiet pytest
  script:
    - python -m compileall -q modules/tia_agent_charter.py modules/tia_agent_store.py modules/tia_agent_admin.py modules/tia_page.py modules/tia_session_scheduler.py modules/tia_scheduler_worker.py modules/tia_knowledge_router.py modules/tia_visual_knowledge.py modules/tia_guidance_panel.py
    - python -m pytest -q tests/test_tia_agent_messaging.py tests/test_tia_scheduler_worker.py tests/test_tia_session_scheduler.py tests/test_tia_knowledge_router.py tests/test_tia_visual_knowledge.py tests/test_tia_guidance_panel.py

telegram_alerts:
  stage: test
  timeout: 15m
  resource_group: telegram-alerts
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  cache:
    - key: pip-312
      paths:
        - .cache/pip
    - key: tg-state
      paths:
        - .tg_sent.json
        - .tc_sent.json
        - .brain_sent.json
        - .brain_log.jsonl
        - .brain_graded.json
        - .brain_agents.jsonl
        - .signal_log.jsonl
      when: always
  before_script:
    - pip install --quiet pandas numpy requests tzdata
  script:
    - python -m modules.tg_cron || true
    - python -m modules.tclass_cron || true
    - python -m modules.brain_cron
    - python -m modules.signal_log || true
  artifacts:
    when: always
    paths:
      - .signal_log.jsonl
    expire_in: 90 days
    exclude:
      - .cache/**/*
