<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--bg:#0f1218;--panel:#151a22;--line:#262d39;--txt:#e6eaf0;--mut:#8b95a5;--up:#1f9d6b;--dn:#e5484d;--amb:#f5a524;--sel:#5b8def}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:12px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{display:grid;grid-template-columns:1fr 1fr;gap:8px;height:100%;padding:4px}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:0;display:flex;flex-direction:column}
.hd{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.hd b{font-size:12px}.chip{border:1px solid var(--line);border-radius:10px;padding:1px 7px;font-size:11px;white-space:nowrap}
#map{flex:1;min-height:0}#map svg{width:100%;height:100%;display:block}
.bub{cursor:pointer;transition:transform .15s}.bub:hover,.bub.sel{transform:scale(1.9)}.bub.dim{opacity:.18}
.lbl{font-size:9.5px;font-weight:700;pointer-events:none}
#tip{position:fixed;pointer-events:none;background:#0b0e13f2;border:1px solid var(--line);border-radius:8px;padding:8px;min-width:230px;display:none;z-index:9;font-size:11px}
#tip .row{display:flex;justify-content:space-between;gap:10px}
input,select,button{background:#0f141b;color:var(--txt);border:1px solid var(--line);border-radius:6px;font:inherit;padding:3px 6px}
button.on{border-color:var(--amb);color:var(--amb)}.seg button{border-radius:0;margin-left:-1px}.seg button.act{background:#22303f;border-color:var(--sel)}
#list{flex:1;overflow:auto}
.r{font-size:11.5px;display:grid;grid-template-columns:96px 128px minmax(140px,1fr) 74px 58px 132px;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.r:hover{background:#1a212c}.r.sel{background:#1c2636;outline:1px solid var(--sel)}.r.flash{animation:fl 1s 4}
@keyframes fl{50%{background:#3a2d10}}
.sym b{font-size:12.5px}.sm{color:var(--mut);font-size:10.5px}
.pill{display:inline-block;border-radius:9px;padding:1px 7px;font-size:10.5px;font-weight:700}
.meter{position:relative;height:16px;background:#202836;border-radius:4px;overflow:hidden}
.meter i{position:absolute;top:0;bottom:0}.meter span{position:absolute;inset:0;text-align:center;font-weight:800;font-size:11px;line-height:16px}
.strip{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;margin-top:3px}
.strip div{height:14px;border-radius:2px;font-size:8.5px;text-align:center;line-height:14px;color:#fff;font-weight:700}
.tfb{display:flex;align-items:flex-end;gap:2px;height:26px}.tfb div{width:7px;border-radius:2px 2px 0 0}
.plan{font-variant-numeric:tabular-nums}.rr{font-weight:800;border-radius:4px;padding:0 5px}
.gauge{height:6px;background:var(--dn);border-radius:3px;overflow:hidden}.gauge i{display:block;height:100%;background:var(--up)}
.det{grid-column:1/-1;display:none;background:#10151d;border-radius:6px;padding:6px 8px;color:var(--mut)}.r.open .det{display:block}
.det b{color:var(--txt)}#toast{position:absolute;right:10px;top:8px;z-index:8}
#toast div{background:#3a2d10;border:1px solid var(--amb);border-radius:6px;padding:4px 8px;margin-bottom:4px;font-weight:700}
.colh{display:grid;grid-template-columns:96px 128px minmax(140px,1fr) 74px 58px 132px;gap:8px;padding:4px 8px;color:var(--mut);font-size:10.5px;border-bottom:1px solid var(--line)}
</style></head><body>
<div id="app">
 <div class="pane"><div class="hd" id="mh"></div><div id="map"></div></div>
 <div class="pane" style="position:relative"><div id="toast"></div>
  <div class="hd">
   <input id="q" placeholder="Search symbol, setup, school…" style="flex:1;min-width:120px">
   <span class="seg"><button data-d="0" class="act">All</button><button data-d="1">Long</button><button data-d="-1">Short</button></span>
   <label class="sm">Min <input id="mc" type="range" min="0" max="100" step="5" value="0" style="width:70px;vertical-align:middle"> <b id="mcv">0</b></label>
   <select id="so"><option value="score">Best first</option><option value="conv">Conviction</option><option value="rr">R:R</option><option value="fresh">Freshest</option><option value="rsi">RSI ↓</option><option value="flow">Flow buy %</option></select>
   <button id="arm" title="Alarm: beep + flash when a symbol reaches the Min conviction with R:R ≥ 1.5 (once per symbol / side / 6 h)">🔔 Alarm off</button>
   <span class="sm" id="cnt"></span>
  </div>
  <div class="colh"><div>Symbol · candle closes</div><div>Verdict · state</div><div>Conviction · 9 schools</div><div>RSI by TF</div><div>Flow</div><div>Plan · entry / stop / target</div></div>
  <div id="list"></div>
 </div>
</div>
<div id="tip"></div>
<script>
const D = __DATA__;
const $ = s => document.querySelector(s), esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const BAND = v => v == null ? null : v >= 70 ? D.bands[0] : v >= 60 ? D.bands[1] : v > 40 ? D.bands[2] : v > 30 ? D.bands[3] : D.bands[4];
const VC = v => v > 0 ? "var(--up)" : v < 0 ? "var(--dn)" : "#3a4352";
const fp = x => x == null ? "—" : Math.abs(x) >= 1000 ? x.toLocaleString(undefined, {maximumFractionDigits: 0}) : Math.abs(x) >= 1 ? x.toFixed(2) : x.toPrecision(4);
const store = {get(k, d){try{return JSON.parse(localStorage.getItem(k)) ?? d}catch(e){return d}}, set(k, v){try{localStorage.setItem(k, JSON.stringify(v))}catch(e){}}};
let dirF = 0, sel = null, armed = store.get("rsihm_arm", false);

// ---------- map: RSI 0-100 vs volume rank, each dot wrapped in a 9-segment school ring
function arc(cx, cy, r, a0, a1){const p = a => [cx + r * Math.cos(a), cy + r * Math.sin(a)], [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 0 1 ${x1.toFixed(1)},${y1.toFixed(1)}`;}
function drawMap(){
  const box = $("#map"), W = Math.max(300, box.clientWidth), H = Math.max(260, box.clientHeight), L = 30, R = 70, T = 14, B = 10, n = Math.max(1, ...D.items.map(i => i.rank));
  const X = k => L + (W - L - R) * (k / (n + 1)), Y = v => T + (H - T - B) * (1 - v / 100);
  let s = `<svg viewBox="0 0 ${W} ${H}">`;
  D.bands.forEach(b => {s += `<rect x="${L}" width="${W - L - R}" y="${Y(b.hi)}" height="${Y(b.lo) - Y(b.hi)}" fill="${b.c}" opacity=".10"/>
    <text x="${W - R + 6}" y="${(Y(b.hi) + Y(b.lo)) / 2 + 4}" fill="${b.c}" font-size="12">${b.name}</text>`;});
  [30, 40, 50, 60, 70].forEach(v => s += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#fff" opacity=".12" stroke-dasharray="3 5"/><text x="${L - 6}" y="${Y(v) + 4}" fill="#8b95a5" font-size="11" text-anchor="end">${v}</text>`);
  if (D.avg != null) s += `<line x1="${L}" x2="${W - R}" y1="${Y(D.avg)}" y2="${Y(D.avg)}" stroke="#f5a524" stroke-dasharray="7 5" stroke-width="1.6"/><text x="${L + 4}" y="${Y(D.avg) - 5}" fill="#f5a524" font-size="12" font-weight="700">Avg RSI ${D.avg.toFixed(2)}</text>`;
  D.items.filter(i => i.rsi_map != null).forEach(i => {
    const cx = X(i.rank), cy = Y(i.rsi_map), r = 3.2 + (i.conv || 0) / 16, b = BAND(i.rsi_map), seg = 2 * Math.PI / D.schools.length;
    let g = `<g class="bub" data-s="${esc(i.full)}" style="transform-origin:${cx}px ${cy}px">`;
    if (i.conv != null) D.schools.forEach((sc, k) => {const v = i.votes[sc].v;
      g += `<path d="${arc(cx, cy, r + 3.4, -Math.PI / 2 + k * seg + .06, -Math.PI / 2 + (k + 1) * seg - .06)}" stroke="${VC(v)}" stroke-width="2.6" fill="none" opacity="${v ? 1 : .55}"/>`;});
    g += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${b.c}" stroke="#0b0e13" stroke-width=".8"/></g>`;
    g += `<text class="lbl" x="${cx}" y="${cy - r - 7}" text-anchor="middle" fill="${b.c}">${esc(i.sym)}${i.speed ? " " + i.speed : ""}</text>`;
    s += g;});
  $("#map").innerHTML = s + "</svg>";
  const counts = D.bands.map(b => `<span class="chip" style="border-color:${b.c};color:${b.c}">${b.name} ${D.items.filter(i => BAND(i.rsi_map) === b).length}</span>`).join("");
  $("#mh").innerHTML = `<b>RSI map · ${esc(D.tf)}</b>${counts}<span class="sm">ring = 9 schools (green long · red short · grey quiet) · size = conviction</span>`;
  document.querySelectorAll(".bub").forEach(el => {const it = D.items.find(i => i.full === el.dataset.s);
    el.onmouseenter = e => tip(it, e); el.onmousemove = e => tip(it, e); el.onmouseleave = () => $("#tip").style.display = "none";
    el.onclick = () => select(it.full, true);});
}
function tip(i, e){
  const t = $("#tip"); let h = `<div class="row"><b style="font-size:13px">${esc(i.full)}</b><span>RSI ${D.tf} <b>${i.rsi_map?.toFixed(2)}</b></span></div>
   <div class="sm" style="margin:2px 0 5px">${esc(i.state)} ${i.speed} · ${esc(i.regime)}</div>`;
  if (i.conv != null){h += `<div class="row"><span class="pill" style="background:${VC(i.dir)}">${esc(i.verdict)}</span><span>conv <b>${i.conv}</b> · ${i.bull}↑ ${i.bear}↓</span></div>`;
    D.schools.forEach(sc => {const v = i.votes[sc]; if (v.v || v.n.length) h += `<div class="row"><span style="color:${VC(v.v)}">● ${sc}</span><span class="sm">${esc(v.n.slice(0, 2).join(", "))}</span></div>`;});}
  if (i.plan) h += `<div class="row" style="margin-top:4px"><span>E ${fp(i.plan.entry)} · SL ${fp(i.plan.stop)} · TP ${fp(i.plan.target)}</span><b>R:R ${i.plan.rr}</b></div>`;
  t.innerHTML = h; t.style.display = "block";
  const x = Math.min(e.clientX + 14, innerWidth - 260), y = Math.min(e.clientY + 10, innerHeight - t.offsetHeight - 6);
  t.style.left = x + "px"; t.style.top = y + "px";
}

// ---------- board
function timer(i){
  if (!i.next_close) return "";
  const s = Math.max(0, Math.round((i.next_close - Date.now()) / 1000)), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return `⏱ ${d ? d + "d " : ""}${d || h ? h + "h " : ""}${m}m${d || h ? "" : " " + (s % 60) + "s"}`;
}
function score(i){return (i.conv || 0) + (i.plan ? Math.min(i.plan.rr, 4) * 6 : 0) + (i.fresh != null ? Math.max(0, 10 - i.fresh * 2) : 0) + (i.speed ? 4 : 0);}
function rowHtml(i){
  const pc = i.dir > 0 ? "var(--up)" : i.dir < 0 ? "var(--dn)" : "#4a5466";
  const strip = D.schools.map(sc => {const v = i.votes ? i.votes[sc] : {v: 0, n: []};
    return `<div title="${esc(sc)}: ${esc(v.n.join(", ") || "quiet")}" style="background:${VC(v.v)};opacity:${v.v ? 1 : .5}">${D.short[sc]}</div>`;}).join("");
  const tfb = D.timeframes.map(tf => {const v = i.rsi[tf], b = BAND(v);
    return `<div title="${tf}: ${v == null ? "no data" : v.toFixed(2)}" style="height:${v == null ? 2 : Math.max(2, v / 100 * 26)}px;background:${b ? b.c : "#333"};${tf === D.tf ? "outline:1px solid #fff" : ""}"></div>`;}).join("");
  const rrC = !i.plan ? "" : i.plan.rr >= 2 ? "var(--up)" : i.plan.rr >= 1 ? "var(--amb)" : "var(--dn)";
  const fl = i.flow && i.flow.buy != null ? `<div class="gauge" title="aggressor buy share"><i style="width:${(i.flow.buy * 100).toFixed(0)}%"></i></div>
     <div class="sm">buy ${(i.flow.buy * 100).toFixed(0)}%${i.flow.book != null ? " · bk " + (i.flow.book * 100 > 0 ? "+" : "") + (i.flow.book * 100).toFixed(0) + "%" : ""}</div>` : `<span class="sm">${i.flow ? "—" : "off"}</span>`;
  const det = i.votes ? D.schools.filter(sc => i.votes[sc].n.length).map(sc => `<b style="color:${VC(i.votes[sc].v)}">${sc}</b>: ${esc(i.votes[sc].n.join(", "))}`).join(" · ") : "";
  return `<div class="r${sel === i.full ? " sel" : ""}" data-s="${esc(i.full)}">
   <div class="sym"><b>${esc(i.sym)}</b> <span style="color:var(--amb)">${esc(i.speed)}</span><div class="sm">${fp(i.price)}</div><div class="sm tm" data-s="${esc(i.full)}">${timer(i)}</div></div>
   <div><span class="pill" style="background:${pc}">${esc(i.verdict || i.state)}</span><div class="sm">${esc(i.state)}${i.fresh != null ? " · fresh " + i.fresh + "b" : ""} · ${esc(i.regime)}</div></div>
   <div>${i.conv != null ? `<div class="meter"><i style="left:0;width:${i.bull_pct / 2}%;background:var(--up);left:${50 - i.bull_pct / 2}%"></i><i style="left:50%;width:${i.bear_pct / 2}%;background:var(--dn)"></i>
     <span>${i.conv} <small style="font-weight:400;opacity:.8">· ${i.bull}↑ ${i.bear}↓ ${9 - i.bull - i.bear}·</small></span></div><div class="strip">${strip}</div>` : `<span class="sm">Radar off</span>`}</div>
   <div><div class="tfb">${tfb}</div><div class="sm">${esc(D.tf)} <b style="color:${BAND(i.rsi_map)?.c || "inherit"}">${i.rsi_map == null ? "—" : i.rsi_map.toFixed(1)}</b></div></div>
   <div>${fl}</div>
   <div class="plan">${i.plan ? `<div>E <b>${fp(i.plan.entry)}</b> <span class="rr" style="background:${rrC}">R:R ${i.plan.rr}</span></div>
     <div class="sm">SL ${fp(i.plan.stop)} (−${i.plan.risk_pct}%) · TP ${fp(i.plan.target)} (+${i.plan.reward_pct}%)</div>` : `<span class="sm">no side</span>`}</div>
   <div class="det">${det || "No school fired on this timeframe."}${i.flow && i.flow.text ? "<br>Flow: " + esc(i.flow.text) : ""}</div></div>`;
}
function rows(){
  const q = $("#q").value.trim().toLowerCase(), mc = +$("#mc").value, so = $("#so").value;
  let it = D.items.filter(i => (!dirF || i.dir === dirF) && (i.conv ?? 0) >= mc &&
    (!q || [i.full, i.sym, i.verdict, i.state, i.regime, ...(i.votes ? D.schools.flatMap(s => i.votes[s].v ? [s, ...i.votes[s].n] : []) : [])].join(" ").toLowerCase().includes(q)));
  const key = {score, conv: i => i.conv ?? -1, rr: i => i.plan ? i.plan.rr : -1, fresh: i => i.fresh == null ? -99 : -i.fresh, rsi: i => i.rsi_map ?? -1, flow: i => i.flow && i.flow.buy != null ? i.flow.buy : -1}[so];
  it.sort((a, b) => key(b) - key(a));
  $("#list").innerHTML = it.map(rowHtml).join("") || `<div class="sm" style="padding:12px">Nothing matches.</div>`;
  $("#cnt").textContent = `${it.length}/${D.items.length}`;
  const shown = new Set(it.map(i => i.full));
  document.querySelectorAll(".bub").forEach(b => b.classList.toggle("dim", !shown.has(b.dataset.s)));
  document.querySelectorAll(".r").forEach(r => r.onclick = () => {select(r.dataset.s, false); r.classList.toggle("open");});
}
function select(full, scroll){
  sel = full;
  document.querySelectorAll(".bub").forEach(b => b.classList.toggle("sel", b.dataset.s === full));
  document.querySelectorAll(".r").forEach(r => r.classList.toggle("sel", r.dataset.s === full));
  if (scroll){const r = document.querySelector(`.r[data-s="${CSS.escape(full)}"]`); if (r){r.scrollIntoView({block: "center", behavior: "smooth"}); r.classList.add("open");}}
}

// ---------- alarm (beep + flash + toast, once per symbol / side / timeframe / 6 h)
let actx = null;
function beep(){try{actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain();
  o.frequency.value = 880; g.gain.setValueAtTime(.18, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + .5);
  o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + .5);}catch(e){}}
function paintArm(){$("#arm").textContent = armed ? "🔔 Alarm on" : "🔕 Alarm off"; $("#arm").classList.toggle("on", armed);}
function checkAlarm(){
  if (!armed) return;
  const mc = Math.max(+$("#mc").value, 30), seen = store.get("rsihm_seen", {}), now = Date.now(), hits = [];
  D.items.forEach(i => {if (!i.dir || (i.conv ?? 0) < mc || !i.plan || i.plan.rr < 1.5 || (dirF && i.dir !== dirF)) return;
    const k = `${i.full}|${D.tf}|${i.dir}`; if (seen[k] && now - seen[k] < 6 * 3600e3) return; seen[k] = now; hits.push(i);});
  store.set("rsihm_seen", seen);
  if (!hits.length) return;
  beep();
  $("#toast").innerHTML = hits.slice(0, 4).map(i => `<div>🔔 ${esc(i.sym)} · ${esc(i.verdict)} · conv ${i.conv} · R:R ${i.plan.rr}</div>`).join("");
  setTimeout(() => $("#toast").innerHTML = "", 15000);
  hits.forEach(i => {const r = document.querySelector(`.r[data-s="${CSS.escape(i.full)}"]`); if (r) r.classList.add("flash");});
}
$("#arm").onclick = () => {armed = !armed; store.set("rsihm_arm", armed); paintArm(); if (armed){beep(); checkAlarm();}};
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {dirF = +b.dataset.d; document.querySelectorAll(".seg button").forEach(x => x.classList.toggle("act", x === b)); rows();});
$("#q").oninput = rows; $("#so").onchange = rows;
$("#mc").oninput = () => {$("#mcv").textContent = $("#mc").value; rows();};
const st = store.get("rsihm_ui", null);
if (st){$("#mc").value = st.mc; $("#mcv").textContent = st.mc; $("#so").value = st.so;}
addEventListener("beforeunload", () => store.set("rsihm_ui", {mc: $("#mc").value, so: $("#so").value}));
setInterval(() => document.querySelectorAll(".tm").forEach(el => {const i = D.items.find(x => x.full === el.dataset.s); if (i) el.textContent = timer(i);}), 1000);
drawMap(); paintArm(); rows(); checkAlarm();
let _rz; addEventListener("resize", () => {clearTimeout(_rz); _rz = setTimeout(() => {drawMap(); rows();}, 150);});
</script></body></html>
