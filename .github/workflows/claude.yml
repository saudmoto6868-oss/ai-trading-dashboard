# @claude on an issue / PR comment (works from the GitHub phone app): Claude Code works on this repo, billed to the
# Anthropic Console API credits (secret ANTHROPIC_API_KEY, Settings > Secrets and variables > Actions). Never commit the key.
name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  claude:
    if: contains(github.event.comment.body || github.event.issue.body || '', '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 40"
