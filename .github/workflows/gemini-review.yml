# Manual only: free Gemini review of one PR (verdict in the run summary). Costs nothing on the free tier.
name: Gemini review
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number"
        required: true
permissions:
  contents: read
  pull-requests: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Ask Gemini
        env:
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m modules.pr_review
