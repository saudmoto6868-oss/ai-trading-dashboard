<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 116 50" aria-label="XPiX 6868">
  <defs>
    <linearGradient id="g2" gradientUnits="userSpaceOnUse" x1="0" y1="6" x2="0" y2="32"><stop offset="0" stop-color="#ffe9a3"/><stop offset=".618" stop-color="#f0b90b"/><stop offset="1" stop-color="#b07d00"/></linearGradient>
    <linearGradient id="s2" gradientUnits="userSpaceOnUse" x1="0" y1="6" x2="0" y2="32"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#8d97a5"/></linearGradient>
  </defs>
  <!-- X: the market before the trade - price crossing time (both strokes silver) -->
  <path d="M4 6 L28 32 M28 6 L4 32" stroke="url(#s2)" stroke-width="4.2" stroke-linecap="square" fill="none"/>
  <!-- P = a candlestick: the stem is the wick (runs past the body like a real wick), the bowl is a solid body (height = cap / phi) -->
  <path d="M42 3.5 V34.5" stroke="url(#g2)" stroke-width="2.6"/>
  <path d="M40.7 6 H51.9 A8.03 8.03 0 0 1 51.9 22.07 H40.7 Z" fill="url(#g2)"/>
  <path d="M40.7 6 V32" stroke="url(#g2)" stroke-width="4.2"/>
  <!-- i: the stem (cap / phi tall) and a SQUARE dot = the pixel, the exact entry point -->
  <path d="M70 15.93 V32" stroke="url(#g2)" stroke-width="4.2"/>
  <rect x="67.4" y="6" width="5.2" height="5.2" fill="#fff3c4"/><rect x="66.2" y="4.8" width="7.6" height="7.6" fill="none" stroke="#f0b90b" stroke-width=".8" opacity=".55"/>
  <!-- X: the trade - the rising stroke turns gold (the plan worked: from X to X) -->
  <path d="M84 6 L108 32" stroke="url(#s2)" stroke-width="4.2" stroke-linecap="square" fill="none"/>
  <path d="M84 32 L108 6" stroke="url(#g2)" stroke-width="4.2" stroke-linecap="square" fill="none"/>
  <!-- 6868 under the four letters, small and half hidden -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9" font-weight="700" fill="#c9a227" opacity=".45" text-anchor="middle">
    <text x="16" y="46">6</text><text x="47" y="46">8</text><text x="70" y="46">6</text><text x="96" y="46">8</text>
  </g>
  <!-- golden-section rule: gold part = 1/phi of the width -->
  <path d="M4 38.5 H70.6" stroke="#f0b90b" stroke-width=".7" opacity=".55"/><path d="M70.6 38.5 H108" stroke="#9aa4b2" stroke-width=".7" opacity=".3"/>
</svg>
