name: Order Flow render regression

on:
  push:
    branches: ["fix/orderflow-dedicated-panel-clean"]
    paths:
      - "modules/workspace_app.html"
      - "tests/test_orderflow_render_policy.py"
      - ".github/workflows/orderflow-render-regression.yml"
  pull_request:
    branches: [main]
    paths:
      - "modules/workspace_app.html"
      - "tests/test_orderflow_render_policy.py"
      - ".github/workflows/orderflow-render-regression.yml"

permissions:
  contents: read

jobs:
  render-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Run Order Flow render policy regression
        run: python tests/test_orderflow_render_policy.py
