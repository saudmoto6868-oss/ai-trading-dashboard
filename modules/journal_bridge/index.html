<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0">
<script>
/* Trade journal bridge (hidden Streamlit component). The workspace frame (same origin) calls window.__xpixJournal.push(snapshot);
   the snapshots go to Python as {uid, events:[{seq, rec}]}. Python stores them in trade_journal and sends back acks {uid: last seq},
   so an event is dropped from the queue only once it is saved. Events are re-sent until acked (nothing is lost on a rerun). */
(function(){
  const send = (type, extra) => window.parent.postMessage(Object.assign({isStreamlitMessage:true, type}, extra || {}), "*");
  const uid = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  let seq = 0, queue = [], acks = {}, lastSent = "";
  function flush(){
    const body = JSON.stringify({uid, events: queue});
    if (body === lastSent) return; lastSent = body;
    send("streamlit:setComponentValue", {value:{uid, events: queue}, dataType:"json"});
  }
  window.__xpixJournal = {
    push(rec){ if (!rec || !rec.id) return false; queue.push({seq: ++seq, rec}); if (queue.length > 500) queue = queue.slice(-500); flush(); return true; }
  };
  window.addEventListener("message", ev => {
    const d = ev.data || {}; if (d.type !== "streamlit:render") return;
    const a = d.args || {}; const ack = a.acks || {};
    if (ack[uid] != null){ queue = queue.filter(e => e.seq > ack[uid]); }
    flush();
  });
  send("streamlit:componentReady", {apiVersion:1}); send("streamlit:setFrameHeight", {height:0});
})();
</script></body></html>
