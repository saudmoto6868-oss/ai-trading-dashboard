# Grok (xAI) watch: one request every 6 hours (4 a day) plus manual runs. Saved as an artifact and a run summary (not committed). Cap: one request, 900 output tokens.
name: Grok digest
on:
  # owner 2026-10-28: no paid API (Grok / Claude) - the 6-hourly schedule is OFF; run it by hand only when the owner says so.
  # schedule:
  #   - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Ask Grok once
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          python -m modules.grok_digest
          python -c "import json;print(json.load(open('grok_digest.json'))['digest'])"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: grok-digest
          path: grok_digest.json
          if-no-files-found: error
