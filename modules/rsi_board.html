<!doctype html>
<html lang="ar"><head><meta charset="utf-8">
<style>
:root{--bg:#0e1116;--panel:#141922;--line:#242c38;--txt:#e6eaf0;--mut:#8b95a5;--up:#1f9d6b;--dn:#e5484d;--amb:#f5a524;--sel:#5b8def}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:12px/1.35 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
#src{height:22px;display:flex;align-items:center;gap:10px;padding:0 8px;font-size:10.5px;color:var(--mut);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden}
#src i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:4px;background:var(--up)}#src b{color:var(--txt)}
#src button{margin-inline-start:auto}
#app{display:grid;grid-template-columns:58fr 42fr;gap:6px;height:calc(100% - 22px);padding:4px}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.hd{display:flex;align-items:center;gap:5px;padding:4px 6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:10px;padding:0 7px;font-size:10.5px;white-space:nowrap}
.tag{cursor:pointer;user-select:none}.tag.on{background:#2a2310;border-color:var(--amb);color:var(--amb)}
#map{flex:1;min-height:0}#map svg{width:100%;height:100%;display:block}
.bub{cursor:pointer;transition:transform .15s}.bub:hover,.bub.sel{transform:scale(1.8)}.dim{opacity:.13}
.lbl{font-size:9.5px;font-weight:700;pointer-events:none}
.pulse{animation:pu 1s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.95}50%{opacity:.05}}
#tip{position:fixed;pointer-events:none;background:#0a0d12f5;border:1px solid var(--line);border-radius:8px;padding:8px;width:270px;display:none;z-index:9;font-size:11px;direction:rtl}
.row2{display:flex;justify-content:space-between;gap:8px;align-items:center}
input,select,button{background:#0f141b;color:var(--txt);border:1px solid var(--line);border-radius:12px;font:inherit;font-size:11px;padding:2px 8px;height:24px}
button{cursor:pointer}button.on{border-color:var(--amb);color:var(--amb)}.seg button{border-radius:0;margin-inline-start:-1px}
.seg button:first-child{border-radius:12px 0 0 12px}.seg button:last-child{border-radius:0 12px 12px 0}.seg button.act{background:#22303f;border-color:var(--sel)}
#list{flex:1;overflow:auto;padding:6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:6px;align-content:start}
.grp{grid-column:1/-1;font-weight:800;font-size:11px;color:var(--mut);padding:4px 2px;border-bottom:1px solid var(--line)}
.tile{position:relative;border-radius:8px;padding:7px;border:1px solid var(--line);cursor:pointer;min-height:118px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.tile:hover{border-color:var(--sel)}.tile.sel{outline:1px solid var(--sel)}
.tile .hd2{display:flex;justify-content:space-between;align-items:center;gap:4px}
.tile .nm{font-weight:800;font-size:13px;direction:ltr}.tile .px{font-size:10.5px;color:var(--mut);direction:ltr}
.tile .cv{font-size:20px;font-weight:900;line-height:1}
.tile .vd{font-size:10.5px;font-weight:700;border-radius:8px;padding:0 6px;color:#fff;align-self:flex-start}
.tile .rs{font-size:10.5px;direction:ltr}
.tile .bars{display:flex;align-items:flex-end;gap:2px;height:18px}.tile .bars i{flex:1;border-radius:2px 2px 0 0}
.tile .tg{display:flex;flex-wrap:wrap;gap:2px}.tile .tg span{font-size:9px;border-radius:6px;padding:0 4px;background:#212a37;color:#c9d1dc}
.tile.urg{animation:ub 1.1s ease-in-out infinite}
.tile .arr{position:absolute;top:6px;inset-inline-end:6px;font-size:9px;letter-spacing:1px}
.tile .fl{height:4px;background:var(--dn);border-radius:2px;overflow:hidden}.tile .fl i{display:block;height:100%;background:var(--up)}
.r{padding:5px 7px;border-bottom:1px solid var(--line);cursor:pointer;border-inline-start:3px solid transparent}
.r:hover{background:#19202b}.r.sel{background:#1b2535;border-inline-start-color:var(--sel)}
.r.urg{animation:ub 1.1s ease-in-out infinite}@keyframes ub{0%,100%{border-inline-start-color:var(--amb);background:#241d0c}50%{border-inline-start-color:transparent;background:transparent}}
.l1,.l3{display:flex;align-items:center;gap:6px}.l3{flex-wrap:wrap;row-gap:2px}.sym{font-weight:800;font-size:12.5px;direction:ltr}.sm{color:var(--mut);font-size:10.5px}
.sp{flex:1}.big{font-size:15px;font-weight:800;min-width:26px;text-align:center}
.pill{border-radius:9px;padding:0 7px;font-size:10.5px;font-weight:700;color:#fff;white-space:nowrap}
.l2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:3px 0}
.meter{position:relative;height:10px;background:#202836;border-radius:3px;overflow:hidden}.meter i{position:absolute;top:0;bottom:0}
.strip{display:grid;grid-template-columns:repeat(9,1fr);gap:1px}.strip div{height:10px;border-radius:2px;font-size:7.5px;text-align:center;line-height:10px;color:#fff;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:3px;margin:2px 0}.tags span{font-size:9.5px;border-radius:8px;padding:0 5px;background:#212a37;color:#c9d1dc}
.tags span.u{background:var(--amb);color:#111;font-weight:800}
.tfb{display:flex;align-items:flex-end;gap:1px;height:18px}.tfb div{width:6px;border-radius:2px 2px 0 0}
.ar{display:flex;gap:1px;font-size:8px;line-height:8px}.plan{font-variant-numeric:tabular-nums;font-size:10.5px;direction:ltr}
.rr{font-weight:800;border-radius:4px;padding:0 4px;color:#111}
.gauge{width:46px;height:5px;background:var(--dn);border-radius:3px;overflow:hidden}.gauge i{display:block;height:100%;background:var(--up)}
#drw{position:absolute;inset:0;background:var(--panel);z-index:5;display:none;overflow:auto;direction:rtl;padding:8px}
#drw.open{display:block}#drw h3{margin:0 0 4px;font-size:14px}.box{border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:6px 0;background:#10151d}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}.kv b{display:block;font-size:13px;direction:ltr}.kv small{color:var(--mut);font-size:10px}
.sig{display:flex;gap:6px;align-items:flex-start;padding:4px 0;border-bottom:1px solid #1f2632}.sig .dot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex:0 0 8px}
.sig .tx{flex:1}.sig .nm{font-weight:700}.sig .ds{color:var(--mut);font-size:10.5px}
.sch{margin:6px 0 2px;font-weight:800;font-size:11.5px}
.btn{display:inline-block;border:1px solid var(--sel);border-radius:8px;padding:4px 10px;color:var(--txt);text-decoration:none;font-weight:700}
#legend{position:absolute;inset:0;background:#0d1117f7;z-index:7;display:none;overflow:auto;padding:10px;direction:rtl;font-size:11.5px}
#legend.open{display:block}#legend h4{margin:8px 0 3px;color:var(--amb)}#legend div{margin:2px 0}
#toast{position:absolute;inset-inline-end:8px;bottom:8px;z-index:8}#toast div{background:#3a2d10;border:1px solid var(--amb);border-radius:6px;padding:3px 8px;margin-top:4px;font-weight:700;font-size:11px}
details.flt{position:relative}details.flt summary{list-style:none;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:2px 9px;font-size:11px;display:inline-block}
details.flt[open] .box2{display:flex}.box2{display:none;flex-wrap:wrap;gap:6px;align-items:center;background:#10151d;border:1px solid var(--line);border-radius:8px;padding:6px;margin-top:4px;position:absolute;z-index:6;inset-inline-start:0;min-width:260px}
</style></head><body>
<div id="src"></div>
<div id="app">
 <div class="pane"><div class="hd" id="mh"></div><div id="map"></div><div id="legend"></div></div>
 <div class="pane"><div id="toast"></div><div id="drw"></div>
  <div class="hd">
   <input id="q" placeholder="ابحث: عملة، مدرسة، تاج…" style="flex:1;min-width:110px">
   <span class="seg"><button data-d="0" class="act">الكل</button><button data-d="1">شراء</button><button data-d="-1">بيع</button></span>
   <select id="so" title="الترتيب"><option value="score">الأفضل</option><option value="conv">التوافق</option><option value="rr">R:R</option><option value="fresh">الأحدث</option><option value="rsi">RSI ↓</option><option value="rsiu">RSI ↑</option><option value="flow">الفلو</option><option value="vol">الفوليوم</option></select>
   <button id="arm" title="تنبيه صوتي للعاجل وللتوافق ≥ الحد مع R:R ≥ 1.5">🔕</button>
   <button id="lg">شرح</button>
   <span class="sm" id="cnt"></span>
  </div>
  <div class="hd" id="tagbar"></div>
  <div class="hd">
   <details class="flt"><summary>فلاتر ▾</summary>
    <div class="box2">
     <label class="sm">التوافق ≥ <input id="mc" type="range" min="0" max="100" step="5" value="0" style="width:80px;vertical-align:middle;height:12px"> <b id="mcv">0</b></label>
     <label class="sm">R:R ≥ <select id="mr"><option>0</option><option>1</option><option>1.5</option><option>2</option><option>3</option></select></label>
     <label class="sm">المدرسة <select id="sc"><option value="">أي مدرسة</option></select></label>
     <label class="sm">جديدة خلال <select id="mf"><option value="99">أي وقت</option><option>0</option><option>1</option><option>2</option><option>5</option></select> شمعات</label>
    </div>
   </details>
  </div>
  <div id="list"></div>
 </div>
</div>
<div id="tip"></div>
<script>
const D = __DATA__;
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const A = (k, v) => (D.ar[k] && D.ar[k][v]) || v;
const BAND = v => v == null ? null : v >= 70 ? D.bands[0] : v >= 60 ? D.bands[1] : v > 40 ? D.bands[2] : v > 30 ? D.bands[3] : D.bands[4];
const VC = v => v > 0 ? "var(--up)" : v < 0 ? "var(--dn)" : "#3a4352";
const fp = x => x == null ? "—" : Math.abs(x) >= 1000 ? x.toLocaleString(undefined, {maximumFractionDigits: 0}) : Math.abs(x) >= 1 ? x.toFixed(2) : x.toPrecision(4);
const store = {get(k, d){try{return JSON.parse(localStorage.getItem(k)) ?? d}catch(e){return d}}, set(k, v){try{localStorage.setItem(k, JSON.stringify(v))}catch(e){}}};
const HIGHER = D.timeframes.slice(D.timeframes.indexOf(D.tf) + 1);
let dirF = 0, sel = null, armed = store.get("rsihm_arm", false), tagF = new Set(), openFull = null;
const arrows = i => HIGHER.map(tf => {const v = (i.htf || {})[tf]; return `<span title="فريم ${tf}: ${v > 0 ? "صاعد" : v < 0 ? "هابط" : "مفيش اتجاه"}" style="color:${VC(v)}">${v > 0 ? "▲" : v < 0 ? "▼" : "•"}</span>`;}).join("");

// ---------- source strip
(function(){
  const names = {okx: "OKX", hl: "Hyperliquid", yahoo: "Yahoo", other: "أخرى"}, urg = D.items.filter(i => i.urgent).length;
  $("#src").innerHTML = Object.entries(D.src).map(([k, n]) => `<span><i></i>${names[k] || k} <b>${n}</b></span>`).join("") +
    `<span>فلو <b>${D.flow_n}</b></span><span>خريطة <b>${esc(D.tf)}</b></span><span>آخر تحديث <b>${esc(D.built)}</b></span>` +
    (urg ? `<span style="color:var(--amb)" class="pulse">● ${urg} عاجل</span>` : "");
})();

// ---------- map
function arc(cx, cy, r, a0, a1){const p = a => [cx + r * Math.cos(a), cy + r * Math.sin(a)], [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 0 1 ${x1.toFixed(1)},${y1.toFixed(1)}`;}
function drawMap(){
  const box = $("#map"), W = Math.max(300, box.clientWidth), H = Math.max(260, box.clientHeight), L = 28, R = 74, T = 12, B = 14;
  const n = Math.max(1, ...D.items.map(i => i.rank)), X = k => L + (W - L - R) * (k / (n + 1)), Y = v => T + (H - T - B) * (1 - v / 100);
  const step = Math.min(5, (W - L - R) / (n + 1) / 3);
  let s = `<svg viewBox="0 0 ${W} ${H}">`;
  D.bands.forEach(b => {s += `<rect x="${L}" width="${W - L - R}" y="${Y(b.hi)}" height="${Y(b.lo) - Y(b.hi)}" fill="${b.c}" opacity=".09"/>
    <text x="${W - R + 5}" y="${(Y(b.hi) + Y(b.lo)) / 2 + 4}" fill="${b.c}" font-size="11">${A("band", b.name)}</text>`;});
  [30, 40, 50, 60, 70].forEach(v => s += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#fff" opacity=".1" stroke-dasharray="3 5"/><text x="${L - 5}" y="${Y(v) + 4}" fill="#8b95a5" font-size="10" text-anchor="end">${v}</text>`);
  if (D.avg != null) s += `<line x1="${L}" x2="${W - R}" y1="${Y(D.avg)}" y2="${Y(D.avg)}" stroke="#f5a524" stroke-dasharray="7 5" stroke-width="1.4"/><text x="${L + 4}" y="${Y(D.avg) - 4}" fill="#f5a524" font-size="11" font-weight="700">المتوسط ${D.avg.toFixed(2)}</text>`;
  D.items.filter(i => i.rsi_map != null).forEach(i => {
    const cx = X(i.rank), cy = Y(i.rsi_map), r = 3 + (i.conv || 0) / 16, b = BAND(i.rsi_map), seg = 2 * Math.PI / D.schools.length, tr = i.trail || [];
    let g = `<g data-s="${esc(i.full)}" class="it">`;
    if (tr.length > 1){const pts = tr.map((v, k) => `${(cx - (tr.length - 1 - k) * step).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
      g += `<polyline points="${pts}" fill="none" stroke="${b.c}" stroke-width="1" opacity=".28" stroke-linecap="round" stroke-dasharray="2 2"/>`;}
    if (i.urgent) g += `<circle class="pulse" cx="${cx}" cy="${cy}" r="${r + 9}" fill="none" stroke="#f5a524" stroke-width="2"/>`;
    g += `<g class="bub" style="transform-origin:${cx}px ${cy}px">`;
    if (i.conv != null) D.schools.forEach((sc, k) => {const v = i.votes[sc].v;
      g += `<path d="${arc(cx, cy, r + 3.2, -Math.PI / 2 + k * seg + .07, -Math.PI / 2 + (k + 1) * seg - .07)}" stroke="${VC(v)}" stroke-width="2.4" fill="none" opacity="${v ? 1 : .5}"/>`;});
    g += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${b.c}" stroke="#0b0e13" stroke-width=".8"/></g>`;
    g += `<text class="lbl" x="${cx}" y="${cy - r - 7}" text-anchor="middle" fill="${i.urgent ? "#f5a524" : b.c}">${esc(i.sym)}${i.speed ? " " + i.speed : ""}</text>`;
    if (HIGHER.length) g += `<text x="${cx}" y="${cy + r + 11}" text-anchor="middle" font-size="8" letter-spacing="1">${HIGHER.map(tf => {const v = (i.htf || {})[tf];
      return `<tspan fill="${v > 0 ? "#1f9d6b" : v < 0 ? "#e5484d" : "#5a6474"}">${v > 0 ? "▲" : v < 0 ? "▼" : "•"}</tspan>`;}).join("")}</text>`;
    s += g + "</g>";});
  box.innerHTML = s + "</svg>";
  const counts = D.bands.map(b => `<span class="chip" style="border-color:${b.c};color:${b.c}">${A("band", b.name)} ${D.items.filter(i => BAND(i.rsi_map) === b).length}</span>`).join("");
  const longs = D.items.filter(i => i.dir > 0).length, shorts = D.items.filter(i => i.dir < 0).length;
  $("#mh").innerHTML = `<b>RSI · ${esc(D.tf)}</b>${counts}<span class="chip" style="color:var(--up)">شراء ${longs}</span><span class="chip" style="color:var(--dn)">بيع ${shorts}</span>`;
  $$(".it").forEach(el => {const it = D.items.find(i => i.full === el.dataset.s), bub = el.querySelector(".bub");
    bub.onmouseenter = e => tip(it, e); bub.onmousemove = e => tip(it, e); bub.onmouseleave = () => $("#tip").style.display = "none";
    bub.onclick = () => openDrawer(it.full);});
}
function tip(i, e){
  const t = $("#tip"); let h = `<div class="row2"><b style="direction:ltr">${esc(i.full)}</b><span>RSI ${esc(D.tf)} <b>${i.rsi_map?.toFixed(2)}</b></span></div>
   <div class="sm" style="margin:2px 0 4px">${esc(A("phase", i.phase))} · ${esc(A("regime", i.regime))}</div>`;
  if (i.urgent) h += `<div style="color:var(--amb);font-weight:700">● عاجل: ${esc(i.urgent)}</div>`;
  if (i.tags?.length) h += `<div class="tags">${i.tags.map(t => `<span class="${t === "Urgent" ? "u" : ""}">${esc(A("tag", t))}</span>`).join("")}</div>`;
  if (i.conv != null) h += `<div class="row2"><span class="pill" style="background:${VC(i.dir)}">${esc(A("verdict", i.verdict))}</span><span>توافق <b>${i.conv}</b> · ${i.bull}↑ ${i.bear}↓</span></div>`;
  if (HIGHER.length) h += `<div class="row2"><span>الفريمات الأكبر</span><span class="ar" style="font-size:11px">${arrows(i)}</span></div>`;
  if (i.plan) h += `<div class="row2" style="margin-top:3px"><span class="plan">دخول ${fp(i.plan.entry)} · وقف ${fp(i.plan.stop)} · هدف ${fp(i.plan.target)}</span><b>R:R ${i.plan.rr}</b></div>`;
  h += `<div class="sm" style="margin-top:4px">اضغط للتفاصيل والشارت</div>`;
  t.innerHTML = h; t.style.display = "block";
  t.style.left = Math.min(e.clientX + 14, innerWidth - 280) + "px"; t.style.top = Math.min(e.clientY + 10, innerHeight - t.offsetHeight - 6) + "px";
}

// ---------- drawer: everything about one symbol (Arabic)
function openDrawer(full){
  openFull = full; select(full, false);
  const i = D.items.find(x => x.full === full); if (!i) return;
  const sigs = i.sigs || [];
  const bySchool = D.schools.map(sc => ({sc, rows: sigs.filter(s => s.school === sc), v: i.votes ? i.votes[sc].v : 0})).filter(x => x.rows.length || x.v);
  const rsiRows = D.timeframes.map(tf => {const v = i.rsi[tf], b = BAND(v);
    return `<div class="row2"><span class="sm">${tf}</span><span class="tfb" style="height:10px;flex:1;margin:0 8px"><div style="height:${v == null ? 2 : Math.max(2, v / 100 * 10)}px;width:100%;background:${b ? b.c : "#333"}"></div></span><b style="direction:ltr;color:${b ? b.c : "inherit"}">${v == null ? "—" : v.toFixed(1)}</b><span class="sm">${b ? esc(A("band", b.name)) : ""}</span></div>`;}).join("");
  $("#drw").innerHTML = `
   <div class="row2"><h3 style="direction:ltr">${esc(i.full)}</h3><button onclick="closeDrawer()">✕ إغلاق</button></div>
   <div class="row2"><span class="pill" style="background:${VC(i.dir)};font-size:12px">${esc(A("verdict", i.verdict || "No edge"))}</span><span class="sm">${esc(A("phase", i.phase))} · ${esc(A("regime", i.regime))}</span></div>
   ${i.urgent ? `<div class="box" style="border-color:var(--amb);color:var(--amb);font-weight:700">● عاجل: ${esc(i.urgent)}</div>` : ""}
   <div class="box kv">
     <div><b style="color:${VC(i.dir)}">${i.conv ?? "—"}</b><small>التوافق من 100</small></div>
     <div><b>${i.bull ?? 0}↑ ${i.bear ?? 0}↓</b><small>مدارس شراء / بيع (من 9)</small></div>
     <div><b>${i.fresh != null ? i.fresh + "" : "—"}</b><small>عمر الإشارة (شمعات)</small></div>
     <div><b>${i.atr_pct != null ? i.atr_pct + "%" : "—"}</b><small>ATR</small></div>
   </div>
   ${i.plan ? `<div class="box plan" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;direction:ltr">
     <div><b>${fp(i.plan.entry)}</b><div class="sm">دخول</div></div>
     <div><b style="color:var(--dn)">${fp(i.plan.stop)}</b><div class="sm">وقف (−${i.plan.risk_pct}%)</div></div>
     <div><b style="color:var(--up)">${fp(i.plan.target)}</b><div class="sm">هدف (+${i.plan.reward_pct}%)</div></div>
     <div><b>${i.plan.rr}R</b><div class="sm">نسبة العائد للمخاطرة</div></div></div>` : `<div class="box sm">مفيش اتجاه واضح، مفيش خطة.</div>`}
   <div class="box">${i.svg ? i.svg : `<div class="sm">الشارت متاح لأفضل 25 عملة بس.</div>`}</div>
   <div class="row2" style="margin:6px 0"><a class="btn" href="${esc(i.tv)}" target="_blank" rel="noopener">افتح الشارت على TradingView ↗</a>
     <span class="sm">${esc(i.price != null ? "آخر سعر " + fp(i.price) : "")}</span></div>
   <div class="box"><div class="sch">المدارس التسعة</div>
     ${bySchool.map(x => `<div><div class="sch" style="color:${VC(x.v)}">● ${esc(A("school", x.sc))} <span class="sm">${x.v > 0 ? "شراء" : x.v < 0 ? "بيع" : "هادية"}</span></div>
       ${x.rows.map(r => `<div class="sig"><span class="dot" style="background:${r.v > 0 ? "var(--up)" : "var(--dn)"}"></span><div class="tx"><div class="nm">${esc(r.n)} <span class="tags" style="display:inline"><span style="background:${r.c};color:#111">${esc(r.t)}</span></span></div><div class="ds">${esc(r.d)}</div></div></div>`).join("") || `<div class="sm">مفيش إشارة</div>`}</div>`).join("") || `<div class="sm">مفيش مدرسة بتقول حاجة على الفريم ده.</div>`}
   </div>
   ${(i.harm?.length || i.pats?.length) ? `<div class="box"><div class="sch">هارمونيك ونماذج الشارت</div><div>${[...(i.harm || []), ...(i.pats || [])].map(x => `<span class="tags" style="display:inline-block"><span>${esc(x)}</span></span>`).join(" ")}</div></div>` : ""}
   <div class="box"><div class="sch">الـ RSI على كل الفريمات</div>${rsiRows}</div>
   <div class="box"><div class="sch">الأوردر فلو</div><div class="sm">${i.flow ? esc(i.flow.text) : "مفيش مصدر أوردر فلو للعملة دي"}</div></div>
   <div class="box"><div class="sch">التاجات</div><div class="tags">${(i.tags || []).map(t => `<span class="${t === "Urgent" ? "u" : ""}">${esc(A("tag", t))}</span>`).join("") || "<span class='sm'>مفيش</span>"}</div></div>
   <div class="sm" style="padding:4px 0">الأرقام ومدارس الاستراتيجيات ليها وزن متساوي. التوافق عد مدارس، مش نسبة نجاح. ده دليل لمكان البحث، مش أمر بيع أو شراء.</div>`;
  $("#drw").classList.add("open");
}
function closeDrawer(){$("#drw").classList.remove("open"); openFull = null;}

// ---------- board
function timer(i){
  if (!i.next_close) return "";
  const s = Math.max(0, Math.round((i.next_close - Date.now()) / 1000)), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return `⏱ ${d ? d + "ي " : ""}${d || h ? h + "س " : ""}${m}د${d || h ? "" : " " + (s % 60) + "ث"}`;
}
function score(i){return (i.urgent ? 30 : 0) + (i.conv || 0) + (i.plan ? Math.min(i.plan.rr, 4) * 6 : 0) + (i.fresh != null ? Math.max(0, 10 - i.fresh * 2) : 0) + (i.tags || []).length * 2;}
function tileHtml(i){
  const band = BAND(i.rsi_map), col = band ? band.c : "#4a5466";
  const pc = i.dir > 0 ? "var(--up)" : i.dir < 0 ? "var(--dn)" : "#4a5466";
  const bars = D.timeframes.map(tf => {const v = i.rsi[tf], b = BAND(v);
    return `<i title="${tf}: ${v == null ? "—" : v.toFixed(1)}" style="height:${v == null ? 2 : Math.max(2, v / 100 * 18)}px;background:${b ? b.c : "#333"}"></i>`;}).join("");
  const tags = (i.tags || []).filter(t => t !== "Urgent").slice(0, 3).map(t => `<span>${esc(A("tag", t))}</span>`).join("");
  const flow = i.flow && i.flow.buy != null ? `<div class="fl" title="نسبة الشراء ${(i.flow.buy * 100).toFixed(0)}%"><i style="width:${(i.flow.buy * 100).toFixed(0)}%"></i></div>` : "";
  return `<div class="tile${sel === i.full ? " sel" : ""}${i.urgent ? " urg" : ""}" data-s="${esc(i.full)}" style="background:${col}14;border-color:${i.urgent ? "var(--amb)" : col + "55"}">
   <div class="hd2"><span class="nm">${esc(i.sym)}</span><span class="sm" style="direction:ltr">${fp(i.price)}</span></div>
   <div class="arr">${arrows(i)}</div>
   <div class="hd2"><span class="cv" style="color:${pc}">${i.conv ?? "—"}</span><span class="rs" style="color:${col}">RSI ${i.rsi_map == null ? "—" : i.rsi_map.toFixed(0)}</span></div>
   <span class="vd" style="background:${pc}">${esc(A("verdict", i.verdict || i.state))}</span>
   <div class="bars">${bars}</div>
   ${flow}
   <div class="tg">${tags}</div>
   <div class="sm tm" data-s="${esc(i.full)}" style="direction:ltr;font-size:9.5px">${timer(i)}</div>
  </div>`;
}
function rows(){
  const q = $("#q").value.trim().toLowerCase(), mc = +$("#mc").value, mr = +$("#mr").value, mf = +$("#mf").value, sc = $("#sc").value, so = $("#so").value;
  let it = D.items.filter(i => (!dirF || i.dir === dirF) && (i.conv ?? 0) >= mc && (!mr || (i.plan && i.plan.rr >= mr)) && (mf === 99 || (i.fresh != null && i.fresh <= mf)) &&
    (!sc || (i.votes && i.votes[sc].v && i.votes[sc].v === i.dir)) && [...tagF].every(t => (i.tags || []).includes(t)) &&
    (!q || [i.full, i.sym, i.verdict, i.state, i.regime, ...(i.tags || []).map(t => A("tag", t)), ...(i.votes ? D.schools.flatMap(s => i.votes[s].v ? [s, A("school", s), ...i.votes[s].n] : []) : [])].join(" ").toLowerCase().includes(q)));
  const key = {score, conv: i => i.conv ?? -1, rr: i => i.plan ? i.plan.rr : -1, fresh: i => i.fresh == null ? -99 : -i.fresh, rsi: i => i.rsi_map ?? -1,
    rsiu: i => i.rsi_map == null ? -999 : -i.rsi_map, flow: i => i.flow && i.flow.buy != null ? i.flow.buy : -1, vol: i => i.vol_x ?? -1}[so];
  it.sort((a, b) => key(b) - key(a));
  const grp = (name, arr) => arr.length ? `<div class="grp">${name} · ${arr.length}</div>` + arr.map(tileHtml).join("") : "";
  const longs = it.filter(i => i.dir > 0), shorts = it.filter(i => i.dir < 0), flat = it.filter(i => !i.dir);
  $("#list").innerHTML = (grp("شراء", longs) + grp("بيع", shorts) + grp("مفيش اتجاه", flat)) || `<div class="sm" style="padding:12px">مفيش نتايج بالفلاتر دي.</div>`;
  $("#cnt").textContent = `${it.length}/${D.items.length}`;
  const shown = new Set(it.map(i => i.full));
  $$(".it").forEach(g => g.classList.toggle("dim", !shown.has(g.dataset.s)));
  $$(".tile").forEach(r => r.onclick = () => openDrawer(r.dataset.s));
}
function select(full, scroll){
  sel = full;
  $$(".it .bub").forEach(b => b.classList.toggle("sel", b.parentNode.dataset.s === full));
  $$(".tile").forEach(r => r.classList.toggle("sel", r.dataset.s === full));
  if (scroll){const r = document.querySelector(`.tile[data-s="${CSS.escape(full)}"]`); if (r) r.scrollIntoView({block: "center", behavior: "smooth"});}
}
$("#tagbar").innerHTML = D.tags.map(t => {const n = D.items.filter(i => (i.tags || []).includes(t)).length;
  return `<span class="chip tag" data-t="${t}" style="${n ? "" : "opacity:.4"}">${A("tag", t)} ${n}</span>`;}).join("");
$$(".tag").forEach(c => c.onclick = () => {const t = c.dataset.t; tagF.has(t) ? tagF.delete(t) : tagF.add(t); c.classList.toggle("on"); rows();});
D.schools.forEach(s => $("#sc").insertAdjacentHTML("beforeend", `<option value="${s}">${A("school", s)}</option>`));
$("#lg").onclick = () => $("#legend").classList.toggle("open");
$("#legend").innerHTML = `<div class="row2"><b style="font-size:13px">شرح الشاشة</b><button onclick="$('#legend').classList.remove('open')">✕</button></div>
 <h4>الدايرة حوالين كل نقطة</h4><div>كل قطاع = مدرسة من 9. أخضر = بتقول شراء، أحمر = بتقول بيع، رمادي = هادية. الدايرة اللي كلها ملونة = توافق عالي.</div>
 <h4>حجم النقطة</h4><div>كل ما النقطة أكبر، التوافق أعلى (عدد المدارس المتفقة).</div>
 <h4>الذيل المنقط</h4><div>آخر 6 شمعات من الـ RSI على فريم الخريطة، عشان تعرف العملة جاية منين.</div>
 <h4>أسهم ▲▼ جنب العملة</h4><div>اتجاه الفريمات الأكبر (EMA 9/21). أخضر ▲ صاعد، أحمر ▼ هابط.</div>
 <h4>● بتنور وبتطفي</h4><div>عاجل: إشارة جديدة (عمرها شمعة أو اتنين) مع توافق ≥ 33 و R:R ≥ 1.5، أو توافق ≥ 44 عند تصحيح أو انعكاس، أو حركة RSI سريعة عدّت منطقة.</div>
 <h4>سرعة الـ RSI</h4><div>● = الـ RSI اتحرك 8 نقط أو أكتر في آخر 3 شمعات. ●● = 15 نقطة أو أكتر.</div>
 <h4>التاجات</h4><div>${D.tags.map(t => `<span class="tags" style="display:inline-block"><span>${esc(A("tag", t))}</span></span>`).join(" ")}</div>
 <h4>الخطة</h4><div>دخول = آخر إغلاق. وقف = ورا أقرب قاع أو قمة. هدف = المستوى اللي بعده. R:R = الربح المتوقع ÷ المخاطرة. R:R أقل من 1 = المخاطرة أكبر من الربح.</div>
 <h4>الألوان</h4><div>${D.bands.map(b => `<span style="color:${b.c}">● ${esc(A("band", b.name))} (${b.lo}–${b.hi})</span>`).join(" · ")}</div>
 <h4>تحذير</h4><div>ده دليل لمكان البحث، مش إشارة شراء أو بيع. التوافق عد مدارس مش نسبة نجاح.</div>`;

// ---------- alarm
let actx = null;
function beep(n = 1){try{actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  for (let k = 0; k < n; k++){const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + k * .22;
    o.frequency.value = 880 + k * 220; g.gain.setValueAtTime(.16, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + .18); o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + .2);}}catch(e){}}
function paintArm(){$("#arm").textContent = armed ? "🔔" : "🔕"; $("#arm").classList.toggle("on", armed); $("#arm").title = armed ? "التنبيه شغال" : "التنبيه مقفول";}
function checkAlarm(){
  if (!armed) return;
  const mc = Math.max(+$("#mc").value, 30), seen = store.get("rsihm_seen", {}), now = Date.now(), hits = [];
  D.items.forEach(i => {const ok = i.urgent || (i.dir && (i.conv ?? 0) >= mc && i.plan && i.plan.rr >= 1.5);
    if (!ok || !i.dir || (dirF && i.dir !== dirF)) return;
    const k = `${i.full}|${D.tf}|${i.dir}`; if (seen[k] && now - seen[k] < 6 * 3600e3) return; seen[k] = now; hits.push(i);});
  store.set("rsihm_seen", seen);
  if (!hits.length) return;
  beep(hits.some(i => i.urgent) ? 3 : 1);
  $("#toast").innerHTML = hits.slice(0, 5).map(i => `<div>${i.urgent ? "⚡" : "🔔"} ${esc(i.sym)} · ${esc(A("verdict", i.verdict))} · ${i.conv}${i.plan ? " · " + i.plan.rr + "R" : ""}</div>`).join("");
  setTimeout(() => $("#toast").innerHTML = "", 20000);
}
$("#arm").onclick = () => {armed = !armed; store.set("rsihm_arm", armed); paintArm(); if (armed){beep(); checkAlarm();}};
$$(".seg button").forEach(b => b.onclick = () => {dirF = +b.dataset.d; $$(".seg button").forEach(x => x.classList.toggle("act", x === b)); rows();});
$("#q").oninput = rows; ["#so", "#mr", "#mf", "#sc"].forEach(k => $(k).onchange = rows);
$("#mc").oninput = () => {$("#mcv").textContent = $("#mc").value; rows();};
const ui = store.get("rsihm_ui", null);
if (ui){$("#mc").value = ui.mc; $("#mcv").textContent = ui.mc; $("#so").value = ui.so; $("#mr").value = ui.mr || "0";}
addEventListener("beforeunload", () => store.set("rsihm_ui", {mc: $("#mc").value, so: $("#so").value, mr: $("#mr").value}));
setInterval(() => $$(".tm").forEach(el => {const i = D.items.find(x => x.full === el.dataset.s); if (i) el.textContent = timer(i);}), 1000);
drawMap(); paintArm(); rows(); checkAlarm();
let _rz; addEventListener("resize", () => {clearTimeout(_rz); _rz = setTimeout(() => {drawMap(); rows();}, 150);});
</script></body></html>
